) = λN(t)."},{"start":36.87,"end":40.4,"cap":"Lambda, the finite rate of increase, equals e^r."},{"start":40.8,"end":49.08,"cap":"When λ > 1 the population grows, when λ < 1 it declines, and when λ = 1 it simply replaces itself."}],"end":49.08},{"start":49.83,"sents":[{"start":49.83,"end":55.23,"cap":"Both models are density-independent: per-capita rates do not change with crowding."},{"start":55.63,"end":65.46,"cap":"No population sustains this for long, but it is the baseline every other model modifies, and it describes invasions and recoveries surprisingly well in their early phases."}],"end":65.46}],"sig":"965:0,0,0,0"},"pop-logistic":{"dur":67.18,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":2.85,"cap":"No population grows forever."},{"start":3.25,"end":9.42,"cap":"As density rises, resources dwindle and per-capita growth declines: density dependence."},{"start":9.82,"end":16.55,"cap":"Its simplest form is the logistic model, dN/dt = rN(1 − N/K)."}],"end":16.55},{"start":17.3,"sents":[{"start":17.3,"end":21.44,"cap":"K is the carrying capacity, the density at which births balance deaths."},{"start":21.84,"end":31.07,"cap":"Population growth is fastest at K/2, the inflection point of the S-shaped curve, which is why classic fisheries models place maximum sustainable yield there."}],"end":31.07},{"start":31.82,"sents":[{"start":31.82,"end":35.52,"cap":"Density dependence can act on births, deaths, or both."},{"start":35.92,"end":49.09,"cap":"It is compensatory when recruitment levels off at high density, as in the Beverton–Holt model, and overcompensatory when recruitment actually falls at high density, as in the Ricker model, which can produce boom-and-bust dynamics."}],"end":49.09},{"start":49.84,"sents":[{"start":49.84,"end":52.58,"cap":"At very low density the relationship can reverse."},{"start":52.98,"end":60.19,"cap":"Under an Allee effect, per-capita growth increases with density, because mates are hard to find or group defenses fail."},{"start":60.59,"end":65.88,"cap":"A strong Allee effect creates a critical threshold below which the population declines toward extinction."}],"end":65.88}],"sig":"1001:0,0,0,0"},"pop-chaos":{"dur":63.62,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.4,"cap":"Density dependence rarely acts instantly."},{"start":3.8,"end":10.65,"cap":"If growth responds to density at some time τ in the past, a population can overshoot its carrying capacity."}],"end":10.65},{"start":11.4,"sents":[{"start":11.4,"end":19.57,"cap":"In Hutchinson’s lagged logistic, small values of rτ give a smooth approach to K. Intermediate values give damped oscillations."},{"start":19.97,"end":28.6,"cap":"When rτ exceeds π/2, about 1.57, the population settles into a stable limit cycle and oscillates indefinitely."}],"end":28.6},{"start":29.35,"sents":[{"start":29.35,"end":32.85,"cap":"Populations with discrete generations can do stranger things still."},{"start":33.25,"end":45.54,"cap":"In the logistic map, studied by Robert May in 1976, raising the growth rate drives the population from a stable point, through a cascade of period-doubling bifurcations, into deterministic chaos."}],"end":45.54},{"start":47.79,"sents":[{"start":47.79,"end":56.41,"cap":"Chaos means erratic, aperiodic fluctuations generated by a simple deterministic rule, with extreme sensitivity to initial conditions."},{"start":56.81,"end":61.32,"cap":"May’s lesson: complex dynamics in nature need not have complex causes."}],"end":61.32}],"sig":"890:0,0,1.5,1"},"pop-structure":{"dur":85.04,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":2.7,"cap":"Real populations have structure."},{"start":3.1,"end":13.59,"cap":"A life table tracks survivorship, lₓ, the proportion of a cohort alive at age x, and fecundity, mₓ, the offspring produced per individual at that age."}],"end":13.59},{"start":14.34,"sents":[{"start":14.34,"end":16.89,"cap":"Survivorship curves come in three classic types."},{"start":17.29,"end":21.78,"cap":"Type I: most individuals survive to old age, as in large mammals."},{"start":22.18,"end":26.33,"cap":"Type II: a constant risk of death at every age, as in many birds."},{"start":26.73,"end":32.03,"cap":"Type III: massive early mortality, as in oysters, most fish, and trees."}],"end":32.03},{"start":32.78,"sents":[{"start":32.78,"end":40.75,"cap":"Summing lₓmₓ across ages gives R₀, the net reproductive rate: expected lifetime offspring per individual."},{"start":41.15,"end":45.11,"cap":"When R₀ > 1, the population grows each generation."}],"end":45.11},{"start":45.86,"sents":[{"start":45.86,"end":48.16,"cap":"Matrix models generalize the life table."},{"start":48.56,"end":57.75,"cap":"In a Leslie matrix, organized by age, or a Lefkovitch matrix, organized by stage, the dominant eigenvalue is the asymptotic growth rate λ."},{"start":58.15,"end":64.02,"cap":"The right eigenvector is the stable stage distribution, and the left eigenvector gives reproductive values."}],"end":64.02},{"start":64.77,"sents":[{"start":64.77,"end":69.44,"cap":"Sensitivity and elasticity analyses ask which vital rate most affects λ."},{"start":69.84,"end":82.74,"cap":"For loggerhead sea turtles, Crouse and colleagues showed in 1987 that λ responds far more to the survival of large juveniles than to egg survival, shifting conservation from nesting beaches toward turtle excluder devices on shrimp trawls."}],"end":82.74}],"sig":"1252:0,0,0,0,1"},"pop-stoch":{"dur":96.66,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":2.49,"cap":"Finally, chance."},{"start":2.89,"end":9.76,"cap":"Demographic stochasticity is randomness in the fates of individuals: who lives, who dies, who breeds."},{"start":10.16,"end":12.32,"cap":"It matters most in small populations."},{"start":12.72,"end":20.99,"cap":"Environmental stochasticity is year-to-year variation in vital rates that affects all individuals together, and catastrophes are its extreme form."}],"end":20.99},{"start":21.74,"sents":[{"start":21.74,"end":28.16,"cap":"Under environmental variation, long-run growth follows the geometric mean of λ, not the arithmetic mean."},{"start":28.56,"end":38.11,"cap":"Because the geometric mean is always lower, variability itself depresses growth: a population averaging λ = 1.05 can still decline."}],"end":38.11},{"start":38.86,"sents":[{"start":38.86,"end":47.77,"cap":"Population viability analysis projects these processes forward to estimate extinction risk, often as the probability of falling below a quasi-extinction threshold."},{"start":48.17,"end":57.42,"cap":"A minimum viable population is the smallest size with an acceptable chance of persistence; Shaffer’s classic benchmark was ninety-nine percent over a thousand years."}],"end":57.42},{"start":58.17,"sents":[{"start":58.17,"end":66.65,"cap":"Small populations can spiral downward as inbreeding, lost genetic variation, Allee effects, and stochasticity reinforce one another."},{"start":67.05,"end":70.88,"cap":"Gilpin and Soulé called this the extinction vortex in 1986."}],"end":70.88},{"start":71.63,"sents":[{"start":71.63,"end":73.2,"cap":"Life history ties it together."},{"start":73.6,"end":85.79,"cap":"MacArthur and Wilson’s r- and K-selection contrasted fast, fecund species favored in uncrowded, unpredictable settings with slow, competitive species favored near carrying capacity."},{"start":86.19,"end":94.36,"cap":"Today the fast–slow continuum and Grime’s C-S-R triangle of competitors, stress-tolerators, and ruderals refine that dichotomy."}],"end":94.36}],"sig":"1442:0,0,0,0,1"},"niche-card":{"dur":7.58,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.64,"cap":"Chapter two."},{"start":2.04,"end":5.98,"cap":"Niche theory: what a species needs, and what it does."}],"end":5.98}],"sig":"66:0"},"niche-concepts":{"dur":65.23,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":4.56,"cap":"The niche is ecology’s most used, and most argued-over, concept."},{"start":4.96,"end":11.77,"cap":"Joseph Grinnell, in 1917, framed it as a species’ habitat requirements: the conditions where it can live."},{"start":12.17,"end":17.9,"cap":"The niche of his California thrasher was the chaparral that met its needs for food, cover, and nesting."}],"end":17.9},{"start":18.65,"sents":[{"start":18.65,"end":27.94,"cap":"Charles Elton, in 1927, emphasized function instead: a species’ place in the biotic environment, its relations to food and enemies."},{"start":28.34,"end":34.04,"cap":"As Eugene Odum later put it, habitat is a species’ address, and the niche is its profession."}],"end":34.04},{"start":34.79,"sents":[{"start":34.79,"end":39.55,"cap":"G. Evelyn Hutchinson, in 1957, made the niche quantitative."},{"start":39.95,"end":45.07,"cap":"Treat each environmental factor, such as temperature, moisture, or food size, as an axis."},{"start":45.47,"end":52.43,"cap":"The set of conditions under which a species can persist forms an n-dimensional hypervolume: the Hutchinsonian niche."}],"end":52.43},{"start":53.18,"sents":[{"start":53.18,"end":54.1,"cap":"Notice the shift."},{"start":54.5,"end":60.69,"cap":"Grinnell and Elton described niches as places or roles in the environment and the community, waiting to be filled."},{"start":61.09,"end":63.93,"cap":"Hutchinson made the niche a property of the species itself."}],"end":63.93}],"sig":"961:0,0,0,0"},"niche-realized":{"dur":59.85,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":15.78,"cap":"Hutchinson distinguished the fundamental niche, the full range of conditions where a species could persist on its physiological tolerances alone, from the realized niche, the narrower range it actually occupies once competitors, predators, and pathogens are present."}],"end":15.78},{"start":16.53,"sents":[{"start":16.53,"end":22.84,"cap":"Joseph Connell’s experiments on the Isle of Cumbrae, in Scotland, published in 1961, made this vivid."},{"start":23.24,"end":25.18,"cap":"Two barnacles share the rocky shore."},{"start":25.58,"end":31.28,"cap":"Chthamalus lives high in the intertidal zone, and Balanus, now called Semibalanus, lives below it."}],"end":31.28},{"start":32.03,"sents":[{"start":32.03,"end":36.61,"cap":"When Connell removed Balanus, Chthamalus survived and thrived far lower on the shore."},{"start":37.01,"end":42.93,"cap":"Its fundamental niche extended deep, but there the faster-growing Balanus smothered, undercut, and crushed it."},{"start":43.33,"end":47.12,"cap":"Meanwhile, desiccation at low tide set the upper limit of Balanus."}],"end":47.12},{"start":47.87,"sents":[{"start":47.87,"end":49.77,"cap":"This yields a widely observed rule."},{"start":50.17,"end":57.75,"cap":"Physical stress tends to set a species’ range limit on the harsh side of a gradient, while biotic interactions set the limit on the benign side."}],"end":57.75}],"sig":"947:0,0,0,0.8"},"niche-partition":{"dur":87.41,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":7.08,"cap":"Hutchinson’s 1959 essay, Homage to Santa Rosalia, asked why there are so many kinds of animals."},{"start":7.48,"end":9.26,"cap":"One answer is niche partitioning."},{"start":9.66,"end":18.83,"cap":"In 1958, Robert MacArthur showed that five species of warbler coexist in the same spruce forests by foraging in different parts of the trees, in different ways."}],"end":18.83},{"start":19.58,"sents":[{"start":19.58,"end":24.57,"cap":"Picture each species as a resource utilization curve along an axis such as prey size."},{"start":24.97,"end":30.69,"cap":"Each curve has a width, w, and neighboring curves are separated by a distance, d."},{"start":31.09,"end":34.29,"cap":"The overlap between curves measures the potential for competition."}],"end":34.29},{"start":35.04,"sents":[{"start":35.04,"end":44.97,"cap":"MacArthur and Levins argued in 1967 for limiting similarity: a maximum overlap compatible with coexistence, reached roughly when d falls below w."},{"start":45.37,"end":54.08,"cap":"Hutchinson had noticed that coexisting congeners often differ in body or bill size by a ratio of about 1.3, though that pattern proved weaker than first thought."}],"end":54.08},{"start":54.83,"sents":[{"start":54.83,"end":60.48,"cap":"Where competitors meet, natural selection can push their traits apart: character displacement."},{"start":60.88,"end":72.64,"cap":"In the Galápagos, the ground finches Geospiza fortis and G. fuliginosa have distinct beak depths where they co-occur, but converge on intermediate beaks on islands where each lives alone."}],"end":72.64},{"start":74.19,"sents":[{"start":74.19,"end":82.41,"cap":"Present-day partitioning may therefore be the ghost of competition past, Connell’s phrase for patterns shaped by competition that no longer operates."},{"start":82.81,"end":86.11,"cap":"A lack of competition today does not mean competition never mattered."}],"end":86.11}],"sig":"1368:0,0,0,0.8,0"},"niche-modern":{"dur":73.54,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":6.42,"cap":"In 2003, Jonathan Chase and Mathew Leibold reunited the Grinnellian and Eltonian traditions."},{"start":6.82,"end":16.53,"cap":"A species’ niche has two halves: its requirements, the conditions under which its per-capita growth rate is at least zero, and its impacts, the effects it has on those conditions."}],"end":16.53},{"start":17.28,"sents":[{"start":17.28,"end":23.91,"cap":"On a graph of two resources, requirements become a zero net growth isocline, or ZNGI."},{"start":24.31,"end":28.07,"cap":"Above the line the population grows; below it, it shrinks."},{"start":28.47,"end":33.1,"cap":"Impacts become consumption vectors, showing how the species depletes each resource."},{"start":33.5,"end":38.71,"cap":"Tilman’s resource competition theory, coming next, is built from exactly these pieces."}],"end":38.71},{"start":39.46,"sents":[{"start":39.46,"end":47.2,"cap":"The Grinnellian niche lives on in species distribution models, which relate occurrences to environmental layers to map suitable habitat."},{"start":47.6,"end":59.76,"cap":"Soberón and Peterson’s BAM diagram clarifies what such models estimate: a species occurs where suitable abiotic conditions, favorable biotic interactions, and access through movement all overlap."}],"end":59.76},{"start":60.51,"sents":[{"start":60.51,"end":63.16,"cap":"Finally, organisms reshape their own environments."},{"start":63.56,"end":66.32,"cap":"Beavers flood valleys; earthworms remake soils."},{"start":66.72,"end":71.44,"cap":"This niche construction can alter natural selection on the constructors and on everyone around them."}],"end":71.44}],"sig":"1127:0,0,0,0.8"},"comp-card":{"dur":8.2,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.66,"cap":"Chapter three."},{"start":2.06,"end":6.6,"cap":"Competition: what happens when organisms need the same limited resources."}],"end":6.6}],"sig":"88:0"},"comp-types":{"dur":100.49,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":7.9,"cap":"Competition is a mutually negative interaction, minus–minus, between organisms that require the same limited resource."},{"start":8.3,"end":13.68,"cap":"Intraspecific competition occurs among members of one species and drives density dependence."},{"start":14.08,"end":16.97,"cap":"Interspecific competition occurs between species."}],"end":16.97},{"start":17.72,"sents":[{"start":17.72,"end":25.99,"cap":"By mechanism, exploitative competition is indirect: individuals deplete a shared resource, such as water, nitrogen, or prey."},{"start":26.39,"end":35.69,"cap":"Interference competition is direct: individuals prevent others from using a resource, through aggression, territoriality, or chemical means."}],"end":35.69},{"start":36.44,"sents":[{"start":36.44,"end":55.73,"cap":"Thomas Schoener, in 1983, listed six mechanisms: consumptive competition for resources; preemptive, occupying space first; overgrowth, as when plants or corals shade one another; chemical, or allelopathy, like the juglone released by black walnut; territorial; and encounter, such as fights at a carcass."}],"end":55.73},{"start":56.48,"sents":[{"start":56.48,"end":71.58,"cap":"A. J. Nicholson contrasted scramble competition, where resources are divided so evenly that every individual gets too little, with contest competition, where winners secure what they need and losers get nothing."},{"start":71.98,"end":81.56,"cap":"Competition is also often asymmetric: in plants, competition for light is size-asymmetric, because taller plants shade shorter ones disproportionately."}],"end":81.56},{"start":82.31,"sents":[{"start":82.31,"end":86.95,"cap":"And beware apparent competition, described by Robert Holt in 1977."},{"start":87.35,"end":93.22,"cap":"Two prey species that never share a resource can still depress each other by sustaining a shared predator."},{"start":93.62,"end":98.39,"cap":"In field data it looks just like competition, but it is mediated by a natural enemy."}],"end":98.39}],"sig":"1459:0,0,0,0,0.8"},"comp-lv":{"dur":92.43,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":4.28,"cap":"The Lotka–Volterra competition model extends the logistic."},{"start":4.68,"end":11.68,"cap":"Each species’ growth is slowed by its own density and by the density of its competitor, scaled by a competition coefficient."},{"start":12.08,"end":19.93,"cap":"α₁₂ is the per-capita effect of species two on species one, measured relative to the effect of species one on itself."}],"end":19.93},{"start":20.68,"sents":[{"start":20.68,"end":22.64,"cap":"Plot both species in a phase plane."},{"start":23.04,"end":29.27,"cap":"Each species has a zero-growth isocline, a straight line along which its population neither grows nor shrinks."},{"start":29.67,"end":35.37,"cap":"How the two lines sit relative to each other determines the outcome, and there are exactly four possibilities."}],"end":35.37},{"start":36.12,"sents":[{"start":36.12,"end":41.45,"cap":"If species one’s isocline lies entirely outside species two’s, species one always wins."},{"start":41.85,"end":44.1,"cap":"Reverse them, and species two wins."},{"start":44.5,"end":46.54,"cap":"Either way, the loser is excluded."},{"start":46.94,"end":56.27,"cap":"Georgii Gause saw this in his Paramecium cultures in the 1930s, which gave us the competitive exclusion principle: complete competitors cannot coexist."}],"end":56.27},{"start":57.52,"sents":[{"start":57.52,"end":66.6,"cap":"If the isoclines cross, and each species limits itself more than it limits its competitor, the crossing is a stable equilibrium: coexistence."},{"start":67,"end":72.16,"cap":"If instead each limits its competitor more than itself, the crossing is an unstable saddle."},{"start":72.56,"end":78.15,"cap":"One species still wins, but which one depends on who starts ahead, a classic priority effect."}],"end":78.15},{"start":79.4,"sents":[{"start":79.4,"end":86.75,"cap":"The rule to remember: stable coexistence requires intraspecific competition to be stronger than interspecific competition."},{"start":87.15,"end":90.13,"cap":"Species must limit themselves more than they limit each other."}],"end":90.13}],"sig":"1395:0,0,0.5,0.5,1"},"comp-rstar":{"dur":70.85,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":5.4,"cap":"Lotka–Volterra describes the outcome of competition, but not its mechanism."},{"start":5.8,"end":9.59,"cap":"David Tilman’s resource competition theory makes the mechanism explicit."},{"start":9.99,"end":17.34,"cap":"For a single limiting resource, each species has an R*, the resource level at which its growth exactly balances its losses."}],"end":17.34},{"start":18.09,"sents":[{"start":18.09,"end":21.7,"cap":"A consumer draws the resource down until it reaches its own R*."},{"start":22.1,"end":31.45,"cap":"So when species compete for one resource, the species with the lowest R* wins: it depresses the resource below the level its competitor needs to persist."},{"start":31.85,"end":36.77,"cap":"This R* rule has held up in experiments with algae, bacteria, and grassland plants."}],"end":36.77},{"start":38.02,"sents":[{"start":38.02,"end":45.04,"cap":"With two essential resources, each species’ zero net growth isocline is L-shaped, and two species’ isoclines can cross."},{"start":45.44,"end":53.55,"cap":"They coexist stably when each species is more limited by a different resource, and each consumes relatively more of the resource that limits it most."}],"end":53.55},{"start":54.3,"sents":[{"start":54.3,"end":59.49,"cap":"Which outcome occurs depends on the supply point, the rates at which the two resources are supplied."},{"start":59.89,"end":68.55,"cap":"That is Tilman’s resource-ratio hypothesis: shifting the ratio of nutrients, by fertilization for instance, can reorder which species win."}],"end":68.55}],"sig":"1100:0,0.5,0,1"},"comp-chesson":{"dur":97.27,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":6.43,"cap":"Peter Chesson’s modern coexistence theory, published in 2000, reorganized all of this."},{"start":6.83,"end":15.39,"cap":"Its test for coexistence is mutual invasibility: each species must be able to increase when rare, invading a community dominated by the other."}],"end":15.39},{"start":16.14,"sents":[{"start":16.14,"end":17.96,"cap":"Mechanisms come in two kinds."},{"start":18.36,"end":26.92,"cap":"Stabilizing mechanisms, or niche differences, cause species to limit themselves more than each other, so any species gains an advantage when it becomes rare."},{"start":27.32,"end":34.15,"cap":"Equalizing mechanisms shrink average fitness differences, the inherent competitive advantage of one species over another."}],"end":34.15},{"start":34.9,"sents":[{"start":34.9,"end":38.64,"cap":"Species coexist when niche differences overcome fitness differences."},{"start":39.04,"end":43.27,"cap":"On this plane, the zone of coexistence widens as niche differences grow."},{"start":43.67,"end":49.88,"cap":"Equalizing mechanisms alone can never produce stable coexistence, but they reduce the niche difference required."}],"end":49.88},{"start":51.13,"sents":[{"start":51.13,"end":59.44,"cap":"Stabilizing mechanisms include resource partitioning and Janzen–Connell effects, where specialist natural enemies kill seedlings near their parents."},{"start":59.84,"end":61.58,"cap":"Others depend on fluctuations."},{"start":61.98,"end":70.75,"cap":"The storage effect operates when species respond differently to a variable environment and can store gains, in seed banks or long-lived adults, through bad years."},{"start":71.15,"end":76.66,"cap":"Relative nonlinearity operates when species respond nonlinearly to fluctuating resources."}],"end":76.66},{"start":77.41,"sents":[{"start":77.41,"end":88.11,"cap":"Together these ideas resolve Hutchinson’s 1961 paradox of the plankton: how dozens of phytoplankton species coexist on a handful of resources in an apparently well-mixed lake."},{"start":88.51,"end":94.97,"cap":"Variation in time, natural enemies, and hidden spatial structure keep the system from ever reaching exclusion."}],"end":94.97}],"sig":"1514:0,0,0.5,0,1"},"pred-card":{"dur":6.49,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.6,"cap":"Chapter four."},{"start":2,"end":4.89,"cap":"Predation: the dynamics of eating and being eaten."}],"end":4.89}],"sig":"64:0"},"pred-lv":{"dur":72.91,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":8.68,"cap":"Predation is a plus–minus interaction, and the term spans true predators, herbivores, parasitoids, and parasites."},{"start":9.08,"end":21.01,"cap":"Its simplest model, from Lotka and Volterra in the 1920s, gives prey exponential growth in the absence of predators, and lets predators convert captured prey into new predators while dying at a constant rate."}],"end":21.01},{"start":21.76,"sents":[{"start":21.76,"end":24.12,"cap":"The model’s signature is coupled oscillation."},{"start":24.52,"end":33.27,"cap":"Prey increase, then predators increase; prey crash, and predators follow, with predator peaks lagging prey peaks by about a quarter cycle."}],"end":33.27},{"start":34.02,"sents":[{"start":34.02,"end":38.31,"cap":"In the phase plane, the two populations circle their equilibrium in closed loops."},{"start":38.71,"end":45.77,"cap":"These neutral cycles have an amplitude set entirely by the starting conditions, and any disturbance shifts the system onto a new cycle."},{"start":46.17,"end":50.43,"cap":"The model is structurally unstable, better for intuition than for prediction."}],"end":50.43},{"start":51.18,"sents":[{"start":51.18,"end":52.66,"cap":"Yet real cycles exist."},{"start":53.06,"end":59.53,"cap":"Snowshoe hares and Canada lynx, recorded in Hudson’s Bay Company fur returns, cycle roughly every ten years."},{"start":59.93,"end":70.81,"cap":"Experiments by Charles Krebs and colleagues in the Yukon showed that the hare cycle arises from food and predation acting together, with predation risk also causing stress that suppresses hare reproduction."}],"end":70.81}],"sig":"1142:0,0,0,0.8"},"pred-fr":{"dur":76.98,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":6.4,"cap":"In 1959, C. S. Holling asked how a predator’s feeding rate changes with prey density."},{"start":6.8,"end":10.32,"cap":"The answer is its functional response, and it comes in three types."}],"end":10.32},{"start":11.07,"sents":[{"start":11.07,"end":16.82,"cap":"A Type I response rises linearly until the predator is satiated, typical of filter feeders."},{"start":17.22,"end":21.32,"cap":"A Type II response decelerates, because each capture costs handling time."},{"start":21.72,"end":28.78,"cap":"Holling’s disc equation gives intake as aN / (1 + ahN), where a is the attack rate and h is the handling time."},{"start":29.18,"end":31.26,"cap":"Intake saturates at 1/h."}],"end":31.26},{"start":32.01,"sents":[{"start":32.01,"end":43.22,"cap":"A Type III response is sigmoid: predators take few prey at low density, then accelerate, through learning a search image, switching between prey types, or because scarce prey find refuges."}],"end":43.22},{"start":43.97,"sents":[{"start":43.97,"end":45.58,"cap":"The type matters for stability."},{"start":45.98,"end":52.99,"cap":"With Type II, per-capita risk to prey falls as prey become more numerous, an inverse density dependence that is destabilizing."},{"start":53.39,"end":60.41,"cap":"With Type III, risk rises with prey density at low densities, which can regulate prey and stabilize the interaction."}],"end":60.41},{"start":61.16,"sents":[{"start":61.16,"end":66.94,"cap":"The numerical response is the change in predator numbers, through reproduction or immigration, as prey increase."},{"start":67.34,"end":74.88,"cap":"Multiply the functional and numerical responses to get the total response: the overall predation pressure on the prey population."}],"end":74.88}],"sig":"1187:0,0,0,0,0.8"},"pred-forage":{"dur":49.92,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.65,"cap":"From the predator’s side, these choices are decisions."},{"start":4.05,"end":10.04,"cap":"Optimal foraging theory assumes that natural selection favors foragers that maximize their net rate of energy intake."}],"end":10.04},{"start":10.79,"sents":[{"start":10.79,"end":16.77,"cap":"In the classic diet model, prey types are ranked by profitability: energy gained per unit of handling time."},{"start":17.17,"end":23.12,"cap":"A forager should always take the most profitable prey, and add lower-ranked prey only when better prey are scarce."},{"start":23.52,"end":28.64,"cap":"Whether to eat a poor item depends on the abundance of good items, not on the abundance of poor ones."}],"end":28.64},{"start":29.39,"sents":[{"start":29.39,"end":33.87,"cap":"For patchy food, Eric Charnov’s marginal value theorem predicts when to leave."},{"start":34.27,"end":43.4,"cap":"Gains within a patch diminish as it is depleted, so a forager should leave when its instantaneous intake rate falls to the average rate for the whole habitat, including travel time."},{"start":43.8,"end":47.62,"cap":"The longer the travel between patches, the longer a forager should stay in each."}],"end":47.62}],"sig":"840:0,0,1"},"pred-rm":{"dur":69.63,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":8.76,"cap":"Add two realistic ingredients, prey self-limitation and a Type II functional response, and you have the Rosenzweig–MacArthur model."},{"start":9.16,"end":10.91,"cap":"The prey isocline becomes a hump."},{"start":11.31,"end":16.34,"cap":"The predator isocline is a vertical line at the prey density where predators just replace themselves."}],"end":16.34},{"start":17.09,"sents":[{"start":17.09,"end":23.14,"cap":"If the predator isocline crosses to the right of the hump, trajectories spiral inward to a stable equilibrium."},{"start":23.54,"end":27.73,"cap":"If it crosses to the left, they spiral outward onto a stable limit cycle."}],"end":27.73},{"start":28.48,"sents":[{"start":28.48,"end":31.83,"cap":"Now enrich the system by raising the prey’s carrying capacity."},{"start":32.23,"end":40.47,"cap":"The hump shifts right, past the predator isocline, and stable coexistence gives way to ever-larger cycles that can drive both species toward extinction."},{"start":40.87,"end":44.84,"cap":"Michael Rosenzweig called this the paradox of enrichment in 1971."}],"end":44.84},{"start":46.39,"sents":[{"start":46.39,"end":52.89,"cap":"Host–parasitoid systems have their own classic, the Nicholson–Bailey model, whose oscillations grow without bound."},{"start":53.29,"end":67.33,"cap":"Persistence returns with aggregated attacks, prey refuges, or spatial structure, echoing Carl Huffaker’s 1958 experiments, in which predatory and herbivorous mites persisted only in a complex, patchy universe of oranges."}],"end":67.33}],"sig":"1071:0,0,0.8,1"},"pred-cascade":{"dur":94.07,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.36,"cap":"Predators can structure entire communities."},{"start":3.76,"end":9.21,"cap":"In 1966, Robert Paine removed the sea star Pisaster from rocky shores in Washington."},{"start":9.61,"end":14.7,"cap":"Without it, mussels monopolized the space and the community dropped from fifteen species to eight."},{"start":15.1,"end":21.03,"cap":"Paine called such species keystones: their impact is disproportionately large relative to their abundance."}],"end":21.03},{"start":21.78,"sents":[{"start":21.78,"end":23.84,"cap":"Effects can cascade down food chains."},{"start":24.24,"end":32.64,"cap":"Hairston, Smith, and Slobodkin’s 1960 green world hypothesis argued that predators hold herbivores in check, keeping the world green."},{"start":33.04,"end":37.18,"cap":"In the Aleutian Islands, sea otters eat sea urchins, which graze kelp."},{"start":37.58,"end":43.21,"cap":"When killer whales began eating otters in the 1990s, urchins boomed and kelp forests collapsed."}],"end":43.21},{"start":43.96,"sents":[{"start":43.96,"end":53.58,"cap":"This alternating pattern of effects down a food chain is a trophic cascade, a form of top-down control, as opposed to bottom-up control by resources and productivity."},{"start":53.98,"end":65.9,"cap":"When top predators disappear, smaller predators can surge: mesopredator release, as when the loss of coyotes from fragmented scrub let foxes and house cats increase, and scrub birds declined."}],"end":65.9},{"start":66.65,"sents":[{"start":66.65,"end":68.69,"cap":"Predators also matter without killing."},{"start":69.09,"end":74.94,"cap":"Prey alter foraging, vigilance, habitat use, and physiology in response to risk."},{"start":75.34,"end":78.33,"cap":"These non-consumptive effects make up the ecology of fear."},{"start":78.73,"end":87.89,"cap":"In a 2011 experiment, Liana Zanette and colleagues found that broadcasting predator calls alone cut song sparrow offspring production by about forty percent."},{"start":88.29,"end":91.77,"cap":"Spatial variation in perceived risk forms a landscape of fear."}],"end":91.77}],"sig":"1435:0,0,0,1"},"isl-card":{"dur":8.64,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.64,"cap":"Chapter five."},{"start":2.04,"end":7.04,"cap":"Island biogeography: species richness as a balance of arrivals and losses."}],"end":7.04}],"sig":"88:0"},"isl-sar":{"dur":60.56,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":6.05,"cap":"Islands are natural experiments: replicated, bounded, and easy to count."},{"start":6.45,"end":11.63,"cap":"One of ecology’s oldest generalizations comes from them, the species–area relationship."},{"start":12.03,"end":14.05,"cap":"Larger areas hold more species."}],"end":14.05},{"start":14.8,"sents":[{"start":14.8,"end":19.44,"cap":"It is usually written as a power law, S = cA^z."},{"start":19.84,"end":26.65,"cap":"On log–log axes this becomes a straight line, log S = log c + z log A, with slope z."}],"end":26.65},{"start":27.4,"sents":[{"start":27.4,"end":32.26,"cap":"For true islands, z usually falls between about 0.2 and 0.35."},{"start":32.66,"end":44.39,"cap":"For nested samples of a contiguous mainland it is lower, roughly 0.12 to 0.17, because small mainland samples include transient species spilling over from the surrounding habitat."}],"end":44.39},{"start":45.14,"sents":[{"start":45.14,"end":52.81,"cap":"With z near 0.3, a tenfold loss of area roughly halves the number of species, a rule of thumb attributed to Philip Darlington."},{"start":53.21,"end":58.46,"cap":"The same arithmetic, run in reverse, underlies many estimates of extinction from habitat loss."}],"end":58.46}],"sig":"887:0,0,0,0.8"},"isl-equil":{"dur":74.88,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":9.15,"cap":"In 1963 and 1967, Robert MacArthur and E. O. Wilson proposed the equilibrium theory of island biogeography."},{"start":9.55,"end":17.55,"cap":"The number of species on an island reflects a dynamic balance between two rates: the immigration of new species and the extinction of resident ones."}],"end":17.55},{"start":18.3,"sents":[{"start":18.3,"end":25.05,"cap":"The immigration rate falls as an island fills, reaching zero when all P species of the mainland source pool are present."},{"start":25.45,"end":32.2,"cap":"The extinction rate rises with richness, because more species means smaller populations and more species to lose."},{"start":32.6,"end":39.05,"cap":"Both curves bend: the best dispersers arrive first, and competition intensifies as species pack in."}],"end":39.05},{"start":39.8,"sents":[{"start":39.8,"end":44.69,"cap":"Where the curves cross lies the equilibrium species richness, Ŝ."},{"start":45.09,"end":51.97,"cap":"The rate at that crossing is the turnover rate: even when richness holds steady, the identity of the species keeps changing."}],"end":51.97},{"start":53.22,"sents":[{"start":53.22,"end":59.78,"cap":"Distance controls immigration: near islands receive more colonists than far ones, the distance effect."},{"start":60.18,"end":67.24,"cap":"Area controls extinction: large islands support larger populations that persist longer, the area effect."},{"start":67.64,"end":72.58,"cap":"So large, near islands hold the most species, and small, far islands the fewest."}],"end":72.58}],"sig":"1074:0,0,0.5,1"},"isl-tests":{"dur":68.16,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":2.68,"cap":"The theory was tested directly."},{"start":3.08,"end":10.71,"cap":"Daniel Simberloff and E. O. Wilson tented small mangrove islands in the Florida Keys and fumigated them to remove every arthropod."},{"start":11.11,"end":19.43,"cap":"Within about a year, species numbers returned close to their original levels, with the nearest island richest, but the species were often different ones."},{"start":19.83,"end":23.01,"cap":"That is equilibrium with turnover, as predicted."}],"end":23.01},{"start":23.76,"sents":[{"start":23.76,"end":24.9,"cap":"Refinements followed."},{"start":25.3,"end":36.91,"cap":"James Brown and Astrid Kodric-Brown described the rescue effect in 1977: on near islands, immigrants bolster dwindling populations, lowering extinction rates."},{"start":37.31,"end":43.57,"cap":"The target effect works the other way: larger islands intercept more dispersers, raising immigration."},{"start":43.97,"end":48.33,"cap":"Both blur the neat assignment of distance to immigration and area to extinction."}],"end":48.33},{"start":49.08,"sents":[{"start":49.08,"end":51.64,"cap":"Real islands also add time and evolution."},{"start":52.04,"end":57.5,"cap":"Krakatau, sterilized by its 1883 eruption, has been reassembling ever since."},{"start":57.9,"end":65.86,"cap":"And on the most remote archipelagos, like Hawaiʻi, speciation within the islands, not immigration, becomes the main source of new species."}],"end":65.86}],"sig":"987:0,0,1"},"isl-frag":{"dur":65.76,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":8.01,"cap":"The theory’s greatest influence was on conservation, because fragments of habitat behave like islands in a sea of altered land."},{"start":8.41,"end":15.7,"cap":"A newly isolated fragment holds more species than its new, smaller equilibrium, so its richness decays toward that lower level."},{"start":16.1,"end":19.74,"cap":"This decay is called relaxation, or faunal collapse."}],"end":19.74},{"start":20.49,"sents":[{"start":20.49,"end":28.65,"cap":"The species destined to vanish but not yet gone constitute an extinction debt, a debt that will be paid unless habitat is restored or reconnected."},{"start":29.05,"end":38.02,"cap":"William Newmark found in 1987 that western North American national parks had lost mammal species since their establishment, with the smallest parks losing the most."}],"end":38.02},{"start":38.77,"sents":[{"start":38.77,"end":46.78,"cap":"Island theory also sparked the SLOSS debate: for the same total area, is it better to protect a single large reserve or several small ones?"},{"start":47.18,"end":56.06,"cap":"A single large reserve supports area-sensitive species and larger populations; several small reserves can capture more habitat variety and spread risk."},{"start":56.46,"end":63.46,"cap":"The answer depends on nestedness, dispersal, and the threats involved, and the question led directly to metapopulation thinking."}],"end":63.46}],"sig":"1041:0,0,1"},"meta-card":{"dur":7.81,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.69,"cap":"Chapter six."},{"start":2.09,"end":6.21,"cap":"Metapopulations: persistence across a network of habitat patches."}],"end":6.21}],"sig":"78:0"},"meta-levins":{"dur":68.12,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":12,"cap":"A metapopulation is a population of populations: a set of local populations in discrete habitat patches, connected by dispersal, each with its own chance of going extinct."},{"start":12.4,"end":18.39,"cap":"Richard Levins coined the term in 1969, while thinking about the control of agricultural pests."}],"end":18.39},{"start":19.14,"sents":[{"start":19.14,"end":23.76,"cap":"Levins tracked not individuals but the fraction of patches occupied, p."},{"start":24.16,"end":32.46,"cap":"Empty patches are colonized at rate c·p·(1 − p), and occupied patches go extinct at rate e·p."},{"start":32.86,"end":38.03,"cap":"So dp/dt = cp(1 − p) − ep."}],"end":38.03},{"start":38.78,"sents":[{"start":38.78,"end":46.66,"cap":"This has the same form as the logistic equation, and occupancy settles at an equilibrium, p* = 1 − e/c."}],"end":46.66},{"start":48.21,"sents":[{"start":48.21,"end":61.72,"cap":"The deep insight: a metapopulation can persist indefinitely even though every local population eventually blinks out, provided colonization outpaces extinction, that is, provided c > e."},{"start":62.12,"end":65.82,"cap":"Persistence is a property of the network, not of any single patch."}],"end":65.82}],"sig":"900:0,0,0.8,1"},"meta-threshold":{"dur":55.08,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.26,"cap":"Now destroy a fraction D of the patches."},{"start":3.66,"end":9.28,"cap":"Equilibrium occupancy becomes p* = 1 − D − e/c."},{"start":9.68,"end":12.89,"cap":"Occupancy falls one-for-one with habitat destroyed."}],"end":12.89},{"start":14.14,"sents":[{"start":14.14,"end":20.59,"cap":"The metapopulation goes extinct when D reaches 1 − e/c, while suitable habitat still remains."},{"start":20.99,"end":27.77,"cap":"This is the extinction threshold: a species can disappear from a landscape that still contains empty, suitable patches."}],"end":27.77},{"start":29.52,"sents":[{"start":29.52,"end":30.56,"cap":"Two lessons follow."},{"start":30.96,"end":37.78,"cap":"Empty patches are not evidence that habitat is unimportant; they may be the very patches the network needs for recolonization."},{"start":38.18,"end":45.56,"cap":"And because decline toward a new equilibrium takes time, species that persist after habitat loss may already be committed to extinction."},{"start":45.96,"end":52.78,"cap":"Tilman and colleagues argued in 1994 that the best competitors, often the poorest colonizers, are the first to go."}],"end":52.78}],"sig":"788:0.5,1,1"},"meta-types":{"dur":64.88,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.5,"cap":"Not every metapopulation looks like Levins’s."},{"start":3.9,"end":10.96,"cap":"In a mainland–island system, one large, effectively permanent population supplies colonists to small, extinction-prone ones."},{"start":11.36,"end":16.77,"cap":"In a patchy population, dispersal is so frequent that the patches behave as a single population."},{"start":17.17,"end":25.82,"cap":"In a nonequilibrium metapopulation, extinctions outpace recolonization, often after fragmentation, and the system is in decline."}],"end":25.82},{"start":26.57,"sents":[{"start":26.57,"end":30.65,"cap":"Ronald Pulliam’s 1988 source–sink model adds habitat quality."},{"start":31.05,"end":37.26,"cap":"In source habitats, births exceed deaths, λ > 1, and surplus individuals emigrate."},{"start":37.66,"end":42.92,"cap":"In sink habitats, λ < 1, and populations persist only through immigration."}],"end":42.92},{"start":43.67,"sents":[{"start":43.67,"end":49.69,"cap":"A large share of a species can live in sinks, so local abundance can be a misleading guide to habitat quality."},{"start":50.09,"end":61.58,"cap":"Worse is an ecological trap: a sink that animals actively prefer, because cues that once signaled good habitat no longer do, as when grassland birds nest in hayfields mowed before their chicks fledge."}],"end":61.58}],"sig":"968:0,0,2"},"meta-hanski":{"dur":48.88,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.92,"cap":"Ilkka Hanski made the theory spatially realistic."},{"start":4.32,"end":16.12,"cap":"His incidence function model predicts each patch’s probability of occupancy from its area, which sets extinction risk, and its connectivity, a sum of contributions from occupied patches weighted by their distance."}],"end":16.12},{"start":16.87,"sents":[{"start":16.87,"end":30.14,"cap":"His test case became the flagship of the field: the Glanville fritillary butterfly, living as a metapopulation across some four thousand dry meadows in Finland’s Åland Islands, where local populations wink out and reappear every year."}],"end":30.14},{"start":30.89,"sents":[{"start":30.89,"end":32.72,"cap":"Two more forces shape persistence."},{"start":33.12,"end":39.52,"cap":"Dispersal provides rescue, but it can also synchronize local dynamics, and so can shared weather, the Moran effect."},{"start":39.92,"end":46.58,"cap":"When patches fluctuate in synchrony they crash together, and the spreading of risk that lets a metapopulation persist is lost."}],"end":46.58}],"sig":"775:0,0,1"},"mc-card":{"dur":7.17,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.72,"cap":"Chapter seven."},{"start":2.12,"end":5.57,"cap":"Metacommunities: linking local communities across a region."}],"end":5.57}],"sig":"74:0"},"mc-scale":{"dur":71.09,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":11.21,"cap":"A metacommunity, as defined by Mathew Leibold and colleagues in 2004, is a set of local communities linked by the dispersal of multiple, potentially interacting species."},{"start":11.61,"end":14.63,"cap":"It is the community-level counterpart of the metapopulation."}],"end":14.63},{"start":15.38,"sents":[{"start":15.38,"end":17.92,"cap":"Its diversity is partitioned across scales."},{"start":18.32,"end":28.77,"cap":"Alpha diversity is local richness; gamma diversity is the regional total; and beta diversity, the variation in composition among sites, links them."},{"start":29.17,"end":33.1,"cap":"In Whittaker’s multiplicative form, γ = α × β."}],"end":33.1},{"start":34.35,"sents":[{"start":34.35,"end":46.45,"cap":"Beta diversity itself has two components: turnover, as species replace one another along gradients, and nestedness, as species-poor sites hold subsets of the species found at richer sites."}],"end":46.45},{"start":47.7,"sents":[{"start":47.7,"end":53.24,"cap":"Community assembly is often pictured as a series of filters acting on a regional species pool."},{"start":53.64,"end":61.97,"cap":"Dispersal determines who arrives, environmental filtering determines who can tolerate local conditions, and biotic interactions determine who remains."},{"start":62.37,"end":68.79,"cap":"Kraft and colleagues cautioned in 2015 that competition can produce patterns easily mistaken for environmental filtering."}],"end":68.79}],"sig":"1047:0,0.5,0.5,1"},"mc-paradigms":{"dur":66.12,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.78,"cap":"Leibold and colleagues described four paradigms."},{"start":4.18,"end":18.2,"cap":"In patch dynamics, patches are identical, and species coexist regionally through a competition–colonization trade-off: superior competitors are poor dispersers, so fugitive species persist by reaching empty patches first."}],"end":18.2},{"start":18.95,"sents":[{"start":18.95,"end":25,"cap":"In species sorting, patches differ in environmental conditions, and each species does best in different ones."},{"start":25.4,"end":31.37,"cap":"Dispersal is sufficient for species to reach suitable patches, so local composition tracks the environment."},{"start":31.77,"end":34.47,"cap":"This is classic niche theory, set in space."}],"end":34.47},{"start":35.22,"sents":[{"start":35.22,"end":39.19,"cap":"In mass effects, dispersal is so high that it overrides local fitness."},{"start":39.59,"end":48.61,"cap":"Immigrants spill from patches where a species thrives into patches where it cannot persist alone, a community-wide source–sink dynamic that inflates local diversity."},{"start":49.01,"end":53.1,"cap":"At extreme dispersal, the region homogenizes and diversity falls."}],"end":53.1},{"start":53.85,"sents":[{"start":53.85,"end":61.5,"cap":"And in the neutral paradigm, species are demographically equivalent, and composition drifts through chance births, deaths, and dispersal."},{"start":61.9,"end":63.82,"cap":"We will return to it in the next chapter."}],"end":63.82}],"sig":"1016:0,0,0,1"},"mc-dispersal":{"dur":56.06,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":4.48,"cap":"Across these paradigms, dispersal rate is a master variable."},{"start":4.88,"end":17.86,"cap":"Theory by Nicolas Mouquet and Michel Loreau predicts that local diversity peaks at intermediate dispersal, while beta diversity declines steadily as dispersal homogenizes the region, and regional diversity eventually falls too."}],"end":17.86},{"start":19.11,"sents":[{"start":19.11,"end":33.25,"cap":"To diagnose which processes structure a real metacommunity, ecologists often use variation partitioning: how much variation in species composition is explained by environment alone, by spatial structure alone, and by both together."},{"start":33.65,"end":41.16,"cap":"A large environmental fraction suggests species sorting; a large pure spatial fraction suggests dispersal limitation or drift."}],"end":41.16},{"start":41.91,"sents":[{"start":41.91,"end":44.44,"cap":"Treat these fractions as clues, not verdicts."},{"start":44.84,"end":53.76,"cap":"Unmeasured environmental variables that are spatially structured can masquerade as dispersal effects, and very different processes can leave similar statistical fingerprints."}],"end":53.76}],"sig":"868:0.5,0,1"},"neu-card":{"dur":7.42,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.51,"cap":"Chapter eight."},{"start":1.91,"end":5.82,"cap":"Neutral theory: what chance and dispersal alone can explain."}],"end":5.82}],"sig":"75:0"},"neu-premise":{"dur":72.78,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":4,"cap":"Niche theory explains coexistence through differences."},{"start":4.4,"end":16.24,"cap":"In 2001, Stephen Hubbell’s Unified Neutral Theory of Biodiversity and Biogeography asked a provocative question: how much of nature’s pattern could we explain if species had no differences at all?"}],"end":16.24},{"start":16.99,"sents":[{"start":16.99,"end":27.15,"cap":"Neutral theory assumes ecological equivalence: every individual of every species has identical per-capita chances of birth, death, dispersal, and speciation."},{"start":27.55,"end":31.01,"cap":"It is a theory built on individuals, not on species traits."}],"end":31.01},{"start":31.76,"sents":[{"start":31.76,"end":37.51,"cap":"Communities are zero-sum: a fixed number of individuals, J, saturates the landscape."},{"start":37.91,"end":42.42,"cap":"Whenever one dies, it is replaced by the offspring of another, chosen at random."},{"start":42.82,"end":53.85,"cap":"Species abundances therefore wander by chance, a process called ecological drift, directly analogous to genetic drift in Motoo Kimura’s neutral theory of molecular evolution."}],"end":53.85},{"start":55.4,"sents":[{"start":55.4,"end":61.92,"cap":"In an isolated community, drift alone eventually leads to monodominance: one species takes over."},{"start":62.32,"end":69.98,"cap":"Diversity persists only if it is replenished, by immigration from outside, and, over the longest timescales, by speciation."}],"end":69.98}],"sig":"1031:0,0,0.8,1.5"},"neu-theta":{"dur":79.38,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":2.77,"cap":"Hubbell’s model has two scales."},{"start":3.17,"end":8.54,"cap":"In the metacommunity, new species arise by point speciation, at a rate ν per birth."},{"start":8.94,"end":19.65,"cap":"Diversity there is governed by a single number, the fundamental biodiversity number θ = 2J_Mν, twice the metacommunity size times the speciation rate."},{"start":20.05,"end":26.19,"cap":"At equilibrium, metacommunity abundances follow Fisher’s log-series, and θ equals Fisher’s α."}],"end":26.19},{"start":26.94,"sents":[{"start":26.94,"end":29.24,"cap":"Local communities draw from the metacommunity."},{"start":29.64,"end":38.25,"cap":"With probability m, a dead individual is replaced by an immigrant from the metacommunity; otherwise, by the offspring of a local individual."},{"start":38.65,"end":45.22,"cap":"The immigration probability m sets how strongly dispersal limitation separates local from regional composition."}],"end":45.22},{"start":45.97,"sents":[{"start":45.97,"end":52.47,"cap":"The theory’s central prediction is the species abundance distribution: how many species are common and how many rare."},{"start":52.87,"end":63.82,"cap":"Frank Preston plotted abundances in doubling classes he called octaves, and found a humped, roughly lognormal shape, with the rarest species hidden behind a veil line of incomplete sampling."}],"end":63.82},{"start":64.57,"sents":[{"start":64.57,"end":68.73,"cap":"Hubbell’s zero-sum multinomial reproduces such humped distributions."},{"start":69.13,"end":77.08,"cap":"Dispersal limitation leaves local communities with fewer rare species than the log-series predicts, because rare regional species seldom arrive."}],"end":77.08}],"sig":"1210:0,0,0,1"},"neu-tests":{"dur":61.97,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":7.68,"cap":"Neutral models fit the species abundance distribution of the fifty-hectare forest plot on Barro Colorado Island remarkably well."},{"start":8.08,"end":14.81,"cap":"They also predict distance decay of similarity, as dispersal limitation makes nearby communities more alike than distant ones."}],"end":14.81},{"start":15.56,"sents":[{"start":15.56,"end":18.18,"cap":"But fitting a pattern is weak evidence for a process."},{"start":18.58,"end":30.15,"cap":"Niche-based models can produce the same abundance distributions, and experiments routinely find stabilizing niche differences and species-specific negative density dependence, even among tropical trees."},{"start":30.55,"end":33.32,"cap":"Strict neutrality is almost certainly false."}],"end":33.32},{"start":34.07,"sents":[{"start":34.07,"end":42.67,"cap":"Its lasting value is as a null model: neutral theory shows what chance and dispersal alone can produce, so that departures from it become informative."},{"start":43.07,"end":44.58,"cap":"It also seeded a synthesis."},{"start":44.98,"end":51.24,"cap":"In Chesson’s terms, neutrality is the special case of zero niche differences and zero fitness differences."},{"start":51.64,"end":59.47,"cap":"And Scheffer and van Nes showed how emergent neutrality can arise, with clumps of similar species coexisting almost neutrally within distinct niches."}],"end":59.47}],"sig":"993:0,0,1.2"},"syn-card":{"dur":6.31,"beats":[{"start":0.9,"sents":[{"start":0.9,"end":1.64,"cap":"Chapter nine."},{"start":2.04,"end":4.71,"cap":"Synthesis: one framework for the whole toolkit."}],"end":4.71}],"sig":"61:0"},"syn-vellend":{"dur":67.85,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":17.33,"cap":"Mark Vellend’s theory of ecological communities, developed in 2010 and 2016, reduces community ecology to four high-level processes, borrowed from population genetics: selection, drift, dispersal, and speciation."}],"end":17.33},{"start":18.08,"sents":[{"start":18.08,"end":28.13,"cap":"Selection means deterministic fitness differences among species: niches, competition, predation, and the stabilizing and equalizing mechanisms of coexistence theory."},{"start":28.53,"end":33.71,"cap":"Drift is demographic chance, decisive in small populations and the engine of neutral theory."},{"start":34.11,"end":41.47,"cap":"Dispersal moves organisms among places, from island colonization to metapopulation rescue to metacommunity mass effects."},{"start":41.87,"end":44.64,"cap":"Speciation adds new species to the regional pool."}],"end":44.64},{"start":45.39,"sents":[{"start":45.39,"end":47.87,"cap":"Every chapter you have seen is a particular blend."},{"start":48.27,"end":52.18,"cap":"Island biogeography is dispersal set against stochastic extinction."},{"start":52.58,"end":56.33,"cap":"Metapopulations are colonization and extinction among patches."},{"start":56.73,"end":59.45,"cap":"Species sorting is selection plus dispersal."},{"start":59.85,"end":65.05,"cap":"Neutral theory is drift, dispersal, and speciation, with selection set to zero."}],"end":65.05}],"sig":"949:0,0,1.5"},"syn-review":{"dur":52.77,"beats":[{"start":1.1,"sents":[{"start":1.1,"end":3.7,"cap":"Before your exam, rehearse with questions like these."},{"start":4.1,"end":7.03,"cap":"Why is a Type II functional response destabilizing?"},{"start":7.43,"end":10.07,"cap":"Why does the species with the lowest R* win?"},{"start":10.47,"end":13.15,"cap":"Why don’t empty patches mean habitat is unimportant?"}],"end":13.15},{"start":15.4,"sents":[{"start":15.4,"end":18.69,"cap":"What separates a stabilizing mechanism from an equalizing one?"},{"start":19.09,"end":24.23,"cap":"How do the four metacommunity paradigms differ in dispersal and environmental heterogeneity?"},{"start":24.63,"end":27.3,"cap":"And what does the fundamental biodiversity number measure?"}],"end":27.3},{"start":29.55,"sents":[{"start":29.55,"end":41.12,"cap":"If you can sketch the graphs from memory, the isoclines, the immigration and extinction curves, the phase planes, and explain what moves each line, you understand the theory, not just its vocabulary."},{"start":41.52,"end":44.88,"cap":"The ecological theater is vast, but its rules are learnable."},{"start":45.28,"end":45.77,"cap":"Good luck."}],"end":45.77}],"sig":"695:1.5,1.5,3"}};

<script>/* player.js */
/* Player shell: clock, narration sync, captions, scrubber, drawer, render hooks. */
(function () {
'use strict';
const Th = window.Theater.build(window.TIMING);
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const RENDER = /[?&#]render\b/.test(location.search + location.hash);
const store = { get(k, d) { try { const v = localStorage.getItem('eco-theater:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('eco-theater:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } } };
const fmt = (x) => { x = Math.max(0, x); const m = Math.floor(x / 60), s = Math.floor(x % 60); return `${m}:${String(s).padStart(2, '0')}`; };
const chapters = Th.chapters.map((ch) => { const sc = Th.scenes.filter((s) => s.chapter === ch); return { ch, start: sc[0].start, end: sc[sc.length - 1].end, scenes: sc }; });

// ---------------------------------------------------------------- fonts
const FONT_SPECS = ['48px "Instrument Serif"', 'italic 48px "Instrument Serif"', '400 24px "IBM Plex Sans"', '500 24px "IBM Plex Sans"', '600 24px "IBM Plex Sans"', '40px "STIX Two Text"', 'italic 40px "STIX Two Text"', 'bold 40px "STIX Two Text"', '24px "IBM Plex Mono"'];
const fontsReady = (async () => {
  if (!document.fonts) return;
  const timeout = new Promise((r) => setTimeout(r, 6000));
  try { await Promise.race([Promise.all(FONT_SPECS.map((f) => document.fonts.load(f, 'Aαλθ'))), timeout]); } catch (e) { /* fall back to system faces */ }
  Th.fontsChanged();
})();

// ------------------------------------------------------- render-mode API
if (RENDER) {
  document.body.classList.add('render');
  window.__theater = {
    duration: Th.duration, scenes: Th.scenes.map((s) => ({ id: s.id, start: s.start, dur: s.dur, beats: s.timing.beats.map((b) => [b.start, b.end]), estimated: !!s.timing.estimated })),
    ready: fontsReady.then(() => true),
    frame(t, o = {}) { Th.renderAt(ctx, t, { captions: !!o.captions, debug: !!o.debug }); if (o.noImage) return ''; return cv.toDataURL(o.png ? 'image/png' : 'image/jpeg', o.q || 0.93); },
    errors: () => (Th.errors || []).slice(),
    sheet(times, o = {}) { // contact sheet: grid of frames
      const cols = o.cols || 2, tw = o.w || 960, th = tw * 9 / 16, rows = Math.ceil(times.length / cols);
      const sh = document.createElement('canvas'); sh.width = cols * tw + (cols - 1) * 8; sh.height = rows * th + (rows - 1) * 8; const sc = sh.getContext('2d');
      sc.fillStyle = '#000'; sc.fillRect(0, 0, sh.width, sh.height);
      times.forEach((t, i) => { Th.renderAt(ctx, t, { captions: !!o.captions, debug: true }); sc.drawImage(cv, (i % cols) * (tw + 8), Math.floor(i / cols) * (th + 8), tw, th); });
      return sh.toDataURL('image/jpeg', 0.9);
    },
  };
  return;
}

// ----------------------------------------------------------------- state
let time = 0, playing = false, rate = Number(store.get('rate', 1)), captions = store.get('cc', true), muted = store.get('muted', false);
let lastPerf = performance.now(), dirty = true, started = false, audioOK = false;
const audio = new Audio(); audio.preload = 'auto';
audio.addEventListener('canplay', () => { audioOK = true; });
// Soundtrack: prefer AAC (.m4a), fall back to MP3 where .m4a is not hosted.
const AUDIO_FILES = ['soundtrack.m4a', 'soundtrack.mp3']; let audioFile = AUDIO_FILES[0], triedDirect = false;
audio.addEventListener('error', () => { audioOK = false; if (!triedDirect && audio.src.startsWith('blob:')) { triedDirect = true; audio.src = audioFile; } });
(async () => {
  if (window.NARRATION_SRC) { audio.src = window.NARRATION_SRC; return; }
  for (const f of AUDIO_FILES) {
    try { const r = await fetch(f); if (!r.ok) continue; audioFile = f; audio.src = URL.createObjectURL(await r.blob()); return; } catch (e) { /* try next */ }
  }
  audio.src = AUDIO_FILES[0]; // file:// pages cannot fetch; let the media element load it directly
})();
audio.muted = muted; audio.playbackRate = rate;
$('rate').value = String(rate);
$('durNote').textContent = `Nine chapters · ${Math.round(Th.duration / 60)} minutes`;

// -------------------------------------------------------------- scrubber
const segs = $('segs');
chapters.forEach((c) => { const d = document.createElement('div'); d.className = 'seg'; d.style.flex = String(c.end - c.start); d.style.setProperty('--c', c.ch.color || '#E8B44A'); d.appendChild(document.createElement('i')); segs.appendChild(d); });
const segFills = [...segs.querySelectorAll('.seg i')];
function scrubPos(clientX) { const r = $('scrub').getBoundingClientRect(); return Math.max(0, Math.min(1, (clientX - r.left) / r.width)); }
// account for gaps: map fraction of track width to time via chapter boxes
function fracToTime(f) {
  const boxes = [...segs.children].map((el) => el.getBoundingClientRect()); const r = segs.getBoundingClientRect(); const x = r.left + f * r.width;
  for (let i = 0; i < boxes.length; i++) { const b = boxes[i]; if (x <= b.right + 1.5 || i === boxes.length - 1) { const u = Math.max(0, Math.min(1, (x - b.left) / b.width)); return chapters[i].start + u * (chapters[i].end - chapters[i].start); } }
  return 0;
}
function timeToX(t) {
  const i = Math.max(0, chapters.findIndex((c) => t < c.end)); const c = chapters[i === -1 ? chapters.length - 1 : i]; const el = segs.children[chapters.indexOf(c)];
  const r = segs.getBoundingClientRect(), b = el.getBoundingClientRect(); return b.left - r.left + b.width * Math.max(0, Math.min(1, (t - c.start) / (c.end - c.start)));
}
let dragging = false;
$('scrub').addEventListener('pointerdown', (e) => { dragging = true; $('scrub').setPointerCapture(e.pointerId); seek(fracToTime(scrubPos(e.clientX))); });
$('scrub').addEventListener('pointermove', (e) => {
  const tt = fracToTime(scrubPos(e.clientX)); if (dragging) seek(tt);
  const sc = Th.sceneAt(tt); const tip = $('tip'); tip.hidden = false; tip.innerHTML = `<b>${sc.chapter.roman ? sc.chapter.roman + ' · ' : ''}</b>${sc.kind === 'card' ? sc.chapter.title : sc.title}<span>${fmt(tt)}</span>`;
  const r = $('scrub').getBoundingClientRect(); const w = tip.offsetWidth; tip.style.left = Math.max(w / 2, Math.min(r.width - w / 2, e.clientX - r.left)) + 'px';
});
$('scrub').addEventListener('pointerup', () => { dragging = false; });
$('scrub').addEventListener('pointerleave', () => { $('tip').hidden = true; });
$('scrub').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { seek(time - 5); e.preventDefault(); } if (e.key === 'ArrowRight') { seek(time + 5); e.preventDefault(); } });

// --------------------------------------------------------------- control
function setPlaying(p) {
  playing = p; lastPerf = performance.now();
  $('playIcon').setAttribute('d', p ? 'M6 4.5h4v15H6zm8 0h4v15h-4z' : 'M7 4.5v15l13-7.5z'); $('btnPlay').setAttribute('aria-label', p ? 'Pause' : 'Play');
  $('bigPlay').hidden = true; started = true;
  if (p) { if (time >= Th.duration - 0.05) time = 0; try { audio.currentTime = time; } catch (e) { /* not seekable yet */ } const pr = audio.play(); if (pr) pr.catch(() => { audioOK = false; }); }
  else audio.pause();
}
function seek(t) { time = Math.max(0, Math.min(Th.duration - 0.01, t)); try { audio.currentTime = time; } catch (e) { /* not seekable yet */ } dirty = true; lastPerf = performance.now(); if (!started) { started = true; $('bigPlay').hidden = true; } }
function chapterIndex(t) { let i = 0; chapters.forEach((c, k) => { if (t >= c.start - 0.01) i = k; }); return i; }
$('btnPlay').onclick = () => setPlaying(!playing);
$('bigPlay').onclick = () => setPlaying(true);
cv.addEventListener('click', () => setPlaying(!playing));
$('btnPrev').onclick = () => { const i = chapterIndex(time); seek(time - chapters[i].start > 3 ? chapters[i].start : chapters[Math.max(0, i - 1)].start); };
$('btnNext').onclick = () => { const i = chapterIndex(time); if (i < chapters.length - 1) seek(chapters[i + 1].start); };
$('btnCC').onclick = () => { captions = !captions; store.set('cc', captions); syncButtons(); };
$('btnMute').onclick = () => { muted = !muted; audio.muted = muted; store.set('muted', muted); syncButtons(); };
$('rate').onchange = (e) => { rate = Number(e.target.value); audio.playbackRate = rate; store.set('rate', rate); };
$('btnFull').onclick = () => { const el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); };
function syncButtons() {
  $('btnCC').setAttribute('aria-pressed', String(captions)); $('cap').classList.toggle('off', !captions);
  $('btnMute').setAttribute('aria-pressed', String(muted)); $('btnMute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  $('volIcon').setAttribute('d', muted ? 'M4 9h4l5-4v14l-5-4H4zm12.3.3 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z' : 'M4 9h4l5-4v14l-5-4H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z');
}
syncButtons();
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.metaKey || e.ctrlKey) return;
  const k = e.key;
  if (k === ' ' || k === 'k') { setPlaying(!playing); e.preventDefault(); }
  else if (k === 'ArrowLeft' && e.target.id !== 'scrub') seek(time - 5);
  else if (k === 'ArrowRight' && e.target.id !== 'scrub') seek(time + 5);
  else if (k === 'j') seek(time - 10); else if (k === 'l') seek(time + 10);
  else if (k === 'c') $('btnCC').click(); else if (k === 'm') $('btnMute').click(); else if (k === 'f') $('btnFull').click();
  else if (k === '[') $('btnPrev').click(); else if (k === ']') $('btnNext').click();
  else if (k === 'Escape' && !$('drawer').hidden) closeDrawer();
});

// ---------------------------------------------------------------- drawer
let tab = 'toc';
function openDrawer(which) { tab = which || tab; $('drawer').hidden = false; renderDrawer(); $(tab === 'toc' ? 'tabToc' : 'tabLex').focus(); }
function closeDrawer() { $('drawer').hidden = true; $('btnToc').focus(); }
$('btnToc').onclick = () => ($('drawer').hidden ? openDrawer() : closeDrawer());
$('btnClose').onclick = closeDrawer;
$('tabToc').onclick = () => { tab = 'toc'; renderDrawer(); };
$('tabLex').onclick = () => { tab = 'lex'; renderDrawer(); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderDrawer(filter) {
  $('tabToc').setAttribute('aria-selected', String(tab === 'toc')); $('tabLex').setAttribute('aria-selected', String(tab === 'lex'));
  const body = $('drawerBody');
  if (tab === 'toc') {
    const ci = chapterIndex(time); const cur = Th.sceneAt(time);
    body.innerHTML = chapters.map((c, i) => `<section class="chap${i === ci ? ' now' : ''}" style="--c:${c.ch.color}"><h3 data-t="${c.start}"><span class="rn">${c.ch.roman || '·'}</span>${esc(c.ch.title)}<span class="dur">${fmt(c.end - c.start)}</span></h3><ol>${c.scenes.filter((s) => s.kind !== 'card').map((s) => `<li data-t="${s.start}" class="${s === cur ? 'now' : ''}">${esc(s.title)}<span class="tm">${fmt(s.start)}</span></li>`).join('')}</ol></section>`).join('');
  } else {
    const q = (filter ?? ($('lexSearch') && $('lexSearch').value) ?? '').toLowerCase();
    const items = Th.termIndex.filter((tm) => !q || (tm.term + ' ' + tm.def).toLowerCase().includes(q));
    body.innerHTML = `<input id="lexSearch" type="search" placeholder="Search ${Th.termIndex.length} terms" value="${esc(q)}" aria-label="Search lexicon">` +
      items.map((tm) => { const ch = Th.chapters.find((c) => c.title === tm.chapter); return `<div class="term" data-t="${tm.time}" style="--c:${ch ? ch.color : '#E8B44A'}"><div class="no">No. ${String(tm.no).padStart(3, '0')}</div><div class="nm">${esc(tm.term)}</div><div class="df">${esc(tm.def)}</div><div class="ch">${ch && ch.roman ? ch.roman + ' · ' : ''}${esc(tm.chapter)} · ${fmt(tm.time)}</div></div>`; }).join('') || '<p style="color:var(--ink3)">No matching terms.</p>';
    const inp = $('lexSearch'); inp.oninput = () => { const v = inp.value; renderDrawer(v); const n = $('lexSearch'); n.focus(); n.setSelectionRange(v.length, v.length); };
  }
  body.querySelectorAll('[data-t]').forEach((el) => { el.onclick = () => { seek(Number(el.dataset.t) + 0.01); if (!playing) setPlaying(true); }; });
}

// ---------------------------------------------------------------- sizing
function fit() {
  const avail = window.innerHeight - 150; const w = Math.max(280, Math.min(window.innerWidth - 32, avail * 16 / 9));
  document.documentElement.style.setProperty('--stageW', Math.round(w) + 'px');
  const sw = $('stage').getBoundingClientRect().width; document.documentElement.style.setProperty('--capSize', Math.max(13, sw * 0.0178).toFixed(1) + 'px');
}
window.addEventListener('resize', fit); fit();

// ------------------------------------------------------------- deep link
const hm = location.hash.match(/^#ch(\d)$/); if (hm) { const c = chapters.find((x) => x.ch.index === Number(hm[1])); if (c) time = c.start + 0.01; }
const saved = store.get('pos', 0);
if (!hm && saved > 20 && saved < Th.duration - 20) {
  const b = document.createElement('button'); b.id = 'resume'; b.type = 'button'; b.textContent = `Resume at ${fmt(saved)}`;
  b.onclick = (e) => { e.stopPropagation(); b.remove(); seek(saved); setPlaying(true); }; $('stage').appendChild(b);
  setTimeout(() => b.remove(), 15000);
}

// ------------------------------------------------------------------ loop
let lastCap = null, lastScene = null, lastSave = 0;
function frame(now) {
  const dt = (now - lastPerf) / 1000; lastPerf = now;
  if (playing) {
    time += dt * rate;
    if (audioOK && !audio.paused && Math.abs(audio.currentTime - time) > 0.3) time = audio.currentTime;
    if (audioOK && audio.paused && time < Th.duration - 0.5) { const pr = audio.play(); if (pr) pr.catch(() => {}); }
    if (time >= Th.duration) { time = Th.duration; setPlaying(false); }
    dirty = true;
  }
  if (dirty) {
    const T = started ? time : Math.min(9, Th.duration);
    Th.renderAt(ctx, T);
    const cue = started ? Th.cueAt(time) : null; const txt = cue ? cue.text : '';
    if (txt !== lastCap) { $('cap').textContent = txt; lastCap = txt; }
    const sc = Th.sceneAt(time);
    if (sc !== lastScene) { lastScene = sc; $('nlR').textContent = sc.chapter.roman || ''; $('nlT').textContent = sc.chapter.title; $('nlS').textContent = sc.kind === 'card' ? (sc.chapter.question || '') : sc.title; if (!$('drawer').hidden && tab === 'toc') renderDrawer(); }
    $('time').textContent = `${fmt(time)} / ${fmt(Th.duration)}`;
    const ci = chapterIndex(time);
    segFills.forEach((f, i) => { const c = chapters[i]; f.style.width = (i < ci ? 100 : i > ci ? 0 : 100 * (time - c.start) / (c.end - c.start)) + '%'; });
    $('knob').style.left = timeToX(time) + 'px';
    $('scrub').setAttribute('aria-valuenow', String(Math.round(100 * time / Th.duration))); $('scrub').setAttribute('aria-valuetext', fmt(time));
    if (playing && now - lastSave > 3000) { store.set('pos', time); lastSave = now; }
    dirty = false;
  }
  requestAnimationFrame(frame);
}
fontsReady.then(() => { dirty = true; requestAnimationFrame(frame); });
document.addEventListener('visibilitychange', () => { lastPerf = performance.now(); });
})();

</script>
