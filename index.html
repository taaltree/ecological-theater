<style>

[hidden] { display: none !important; }
html, body { height: 100%; }

<script>/* engine.js */
/* The Ecological Theater — deterministic canvas engine.
 * Every frame is a pure function of time T, so the same code drives the
 * interactive player, frame-exact MP4 rendering, and still previews.
 * Chapter files call Theater.chapter({...}); see ENGINE_GUIDE.md. */
(function (root) {
'use strict';

const W = 1920, H = 1080;

// Palette: deep field-station slate with pigment accents.
const PAL = {
  bg: '#0B1618', bg2: '#10201F', panel: '#122426',
  ink: '#EEE7D7', ink2: '#AEB8B1', ink3: '#6F7F7C',
  rule: 'rgba(238,231,215,0.18)', faint: 'rgba(238,231,215,0.07)',
  moss: '#9CC77E', ochre: '#E8B44A', coral: '#E8735A', lagoon: '#5FC0D2',
  heather: '#B49CE6', rose: '#E58FB0', sand: '#D8C49B', mint: '#7FD6B0',
};
const SPECIES = [PAL.moss, PAL.ochre, PAL.lagoon, PAL.coral, PAL.heather, PAL.rose, PAL.sand, PAL.mint];

const FONTS = {
  display: '"Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif',
  sans: '"IBM Plex Sans", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif',
  math: '"STIX Two Text", "Times New Roman", Times, serif',
  mono: '"IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace',
};

// Layout: header band on top, stage left, lexicon rail right, caption band at bottom.
const LAYOUT = {
  stage: { x: 80, y: 200, w: 1250, h: 720 },
  full: { x: 80, y: 200, w: 1760, h: 720 },
  rail: { x: 1392, y: 206, w: 448, h: 714 },
  capY: 944,
};

// Timing rules shared by the estimator and the audio builder.
const TIMING_RULES = { lead: 1.1, tail: 1.3, gapSentence: 0.32, gapBeat: 0.75, wps: 2.55 };

/* ------------------------------------------------------------------ utils */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => (x - a) / (b - a);
const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
const ease = {
  lin: (t) => clamp(t),
  out: (t) => 1 - Math.pow(1 - clamp(t), 3),
  out2: (t) => 1 - Math.pow(1 - clamp(t), 2),
  in: (t) => Math.pow(clamp(t), 3),
  inOut: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  outBack: (t) => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
function rng(seed) {
  let a = (seed >>> 0) || 1;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) { let u = 0, v = 0; while (u === 0) u = r(); while (v === 0) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function hash3(i, j, s) {
  let h = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function noise1(x, seed = 0) { const i = Math.floor(x), f = x - i; return lerp(hash3(i, 0, seed), hash3(i + 1, 0, seed), smooth(f)) * 2 - 1; }
function noise2(x, y, seed = 0) {
  const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
  const a = hash3(i, j, seed), b = hash3(i + 1, j, seed), c = hash3(i, j + 1, seed), d = hash3(i + 1, j + 1, seed);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy) * 2 - 1;
}
function fbm2(x, y, seed = 0, oct = 4) { let s = 0, a = 0.5, f = 1; for (let k = 0; k < oct; k++) { s += a * noise2(x * f, y * f, seed + k * 17); f *= 2; a *= 0.5; } return s; }
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { if (hex.startsWith('rgb')) return hex; const [r, g, b] = hex2rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); const c = a.map((v, k) => Math.round(lerp(v, b[k], clamp(t)))); return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join(''); }
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }
function fmt(x, d = 2) { return Number(x).toFixed(d); }

const U = { clamp, lerp, inv, smooth, ease, rng, gauss, noise1, noise2, fbm2, hash3, hex2rgb, rgba, mix, hsl, fmt };

/* ------------------------------------------------------------ sentences */
// Split on sentence ends, but not after initials ("E. O. Wilson", "G. fortis") or common abbreviations.
function splitSentences(text) {
  const out = []; let start = 0;
  const re = /([.?!])["”’)]?\s+(?=[A-Z0-9“"(\u0370-\u03FF])/g; let m;
  while ((m = re.exec(text))) {
    const before = text.slice(start, m.index + 1);
    const lastTok = before.trim().split(/\s+/).pop();
    if (/^[A-Z]\.$/.test(lastTok) || /^(e\.g|i\.e|cf|vs|et al|Dr|St|No|approx|ca)\.$/i.test(lastTok) || /^(al)\.$/.test(lastTok)) continue;
    out.push(text.slice(start, m.index + m[0].length).trim()); start = m.index + m[0].length;
  }
  const rest = text.slice(start).trim(); if (rest) out.push(rest);
  return out;
}
function wordCount(s) { return s.split(/\s+/).filter(Boolean).length; }

/* --------------------------------------------------------------- canvas */
const isBrowser = typeof document !== 'undefined';
function makeCanvas(w, h) {
  if (typeof OffscreenCanvas !== 'undefined') return new OffscreenCanvas(w, h);
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}

const glowCache = new Map();
function glowSprite(color) {
  let s = glowCache.get(color); if (s) return s;
  s = makeCanvas(128, 128); const c = s.getContext('2d');
  const gr = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.25, rgba(color, 0.55)); gr.addColorStop(0.6, rgba(color, 0.14)); gr.addColorStop(1, rgba(color, 0));
  c.fillStyle = gr; c.fillRect(0, 0, 128, 128); glowCache.set(color, s); return s;
}

/* ------------------------------------------------------- math typesetter */
// A small TeX-like layout: x_{i}, x^{2}, \frac{a}{b}, \hat{S}, \bar{x}, \text{...}, \ln, \sum, \alpha via unicode.
const GREEK = 'αβγδεζηθικλμνξπρστυφχψωΓΔΘΛΞΠΣΦΨΩ';
const UPGREEK = 'ΓΔΘΛΞΠΣΦΨΩ';
const MSYM = { cdot: '·', times: '×', approx: '≈', ge: '≥', le: '≤', geq: '≥', leq: '≤', neq: '≠', to: '→', infty: '∞', sum: 'Σ', prod: 'Π', partial: '∂', pm: '±', propto: '∝', in: '∈', minus: '−', sim: '∼', ell: 'ℓ', rightarrow: '→', gg: '≫', ll: '≪', prime: '′', lt: '<', gt: '>', star: '*', vert: '|', dots: '…', cdots: '⋯' };
const MFUN = ['ln', 'log', 'exp', 'max', 'min', 'lim', 'var', 'cov', 'E'];
const RELS = '=<>≤≥≈→∝≠∼≫≪';
const BINS = '+−±×·';

function mparse(src) {

(function () {

  id: 'pop', roman: 'I', title: 'Population Dynamics', color: COL,

      beats: [
        { t: 'Begin with a single population and no limits. If each individual has a constant per-capita birth rate, b, and death rate, d, the population grows as dN/dt = rN, where r = b − d is the intrinsic rate of increase.',

          s: 'Species that breed in discrete pulses follow the geometric model, N at t plus one equals lambda times N at t. Lambda, the finite rate of increase, equals e to the r. When lambda is greater than one the population grows, when lambda is less than one it declines, and when lambda equals one it simply replaces itself.' },

<script>/* chapters/ch3_competition.js */
/* Chapter III — Competition. */
(function () {
const { PAL, U, Theater } = window; const { clamp, lerp, ease, rng, gauss } = U;
const COL = PAL.heather;
// Semantic colours used throughout the chapter.
const C1 = PAL.moss, C2 = PAL.rose, RES = PAL.ochre, ENEMY = PAL.coral;

/* ------------------------------------------------------------ helpers */
const label = (g, s, x, y, a = 1, col = PAL.ink3) => g.text(s.toUpperCase(), x, y, { size: 17, weight: 600, color: col, ls: 2.6, alpha: a });
// visibility envelope: in at beat k0, out at beat k1
const vis = (S, k0, k1, d = 0.8) => S.p(k0, d) * (k1 === undefined ? 1 : 1 - S.p(k1, 0.6));
// window with delays: in at beat k0 + d0, out at beat k1 + d1
const win = (S, k0, d0, k1, d1, d = 0.8) => S.p(k0, d, d0) * (k1 === undefined || k1 === null ? 1 : 1 - S.p(k1, 0.6, d1 || 0));
const frac = (x) => x - Math.floor(x);
const H3 = (i, j, s = 7) => U.hash3(i, j, s);
const note = (g, s, x, y, o = {}) => g.text(s, x, y, { size: 21, color: PAL.ink2, ...o });
const panelBox = (g, x, y, w, h, a = 1, stroke = PAL.rule) => g.rect(x, y, w, h, { r: 8, fill: 'rgba(14,29,31,0.55)', stroke, w: 1.4, alpha: a });

// A simple drawn plant: stem + leaf pairs; wilt in [0,1] droops it.
function sprout(g, x, gy, h, col, a = 1, wilt = 0) {
  if (a <= 0) return;
  const c = g.ctx; const tx = x + wilt * h * 0.55, ty = gy - h * (1 - wilt * 0.45);
  g.withAlpha(a, () => {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(2, h * 0.06); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, gy); c.quadraticCurveTo(x, gy - h * 0.55, tx, ty); c.stroke();
    for (let k = 0; k < 3; k++) {
      const f = 0.38 + k * 0.2; const lx = lerp(x, tx, f * f), ly = lerp(gy, ty, f); const s = h * (0.2 - k * 0.03);
      const droop = wilt * 0.9;
      c.beginPath(); c.ellipse(lx - s * 0.6, ly + droop * s * 0.5, s * 0.7, s * 0.26, -0.5 + droop, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(lx + s * 0.6, ly + droop * s * 0.5, s * 0.7, s * 0.26, 0.5 + droop, 0, Math.PI * 2); c.fill();
    }
  });
}
// Hexagon outline
function hexPts(cx, cy, r) { const p = []; for (let k = 0; k <= 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return p; }
// Clash sparks
function sparks(g, x, y, r, col, a, t) {
  if (a <= 0) return;
  for (let k = 0; k < 8; k++) { const ang = k * Math.PI / 4 + 0.3 * Math.sin(t * 9 + k); const r0 = r * 0.35, r1 = r * (0.75 + 0.25 * Math.sin(t * 13 + k * 2)); g.line(x + r0 * Math.cos(ang), y + r0 * Math.sin(ang), x + r1 * Math.cos(ang), y + r1 * Math.sin(ang), { color: col, w: 2.5, alpha: a }); }
}

/* ===================================================== scene 1 helpers */
function signMatrix(g, S) {
  label(g, 'Interaction signs', 140, 262);
  const x0 = 222, y0 = 360, cw = 150, ch = 116, sg = ['+', '0', '−'];
  const nm = { '++': ['mutualism'], '+0': ['commensalism'], '+−': ['predation,', 'parasitism'], '00': ['neutralism'], '0−': ['amensalism'], '−−': ['competition'] };
  const pa = S.p(0, 0.8, 0.2);
  g.text('effect on species 1', x0 + 1.5 * cw, 300, { size: 21, color: PAL.ink2, align: 'center', alpha: pa });
  sg.forEach((s, i) => g.text(s, x0 + (i + 0.5) * cw, 342, { size: 32, role: 'math', align: 'center', alpha: pa }));
  sg.forEach((s, j) => g.text(s, x0 - 24, y0 + (j + 0.5) * ch + 11, { size: 32, role: 'math', align: 'center', alpha: pa }));
  g.with(() => { g.ctx.translate(x0 - 62, y0 + 1.5 * ch); g.ctx.rotate(-Math.PI / 2); g.text('effect on species 2', 0, 0, { size: 21, color: PAL.ink2, align: 'center', alpha: pa }); });
  const hp = S.p(0, 0.9, 2.8);
  for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) {
    const p = S.p(0, 0.6, 0.5 + (i + j) * 0.22); if (p <= 0) continue;
    const x = x0 + i * cw, y = y0 + j * ch; const comp = i === 2 && j === 2; const dup = j > i;
    const key = sg[Math.min(i, j)] + sg[Math.max(i, j)];
    const a = p * (dup ? 0.5 : 1) * (comp ? 1 : 1 - 0.35 * hp);
    g.rect(x + 4, y + 4, cw - 8, ch - 8, { r: 6, fill: comp ? U.rgba(COL, 0.06 + 0.2 * hp) : 'rgba(238,231,215,0.04)', stroke: comp ? COL : PAL.rule, w: comp ? 1.2 + 1.6 * hp : 1.2, alpha: a });
    if (comp) g.glow(x + cw / 2, y + ch / 2, 90, COL, 0.35 * hp);

  }

  g.text('Competition: each lowers the other’s growth,', 140, 776, { size: 22, color: PAL.ink, alpha: q });
  g.text('because both need the same limited resource.', 140, 808, { size: 22, color: PAL.ink2, alpha: q });
}

function crowdBox(g, t, B, cols, n, nVis, seed, a, title, sub, col) {
  if (a <= 0) return;
  g.withAlpha(a, () => {
    panelBox(g, B.x, B.y, B.w, B.h);
    label(g, title, B.x + 20, B.y + 34, 1, col);
    note(g, sub, B.x + 20, B.y + 62, { color: PAL.ink2 });
    // resource specks
    for (let k = 0; k < 12; k++) {
      const x = B.x + 50 + (B.w - 100) * H3(k, 9, seed), y = B.y + 96 + (B.h - 120) * H3(k, 10, seed);
      g.circle(x, y, 3.2, { fill: RES, alpha: 0.55 + 0.25 * Math.sin(t * 2 + k) });
    }
    const pos = [];
    for (let i = 0; i < n; i++) {
      const va = clamp(nVis - i); if (va <= 0) continue;
      const bx = B.x + 52 + (B.w - 104) * H3(i, 1, seed), by = B.y + 104 + (B.h - 150) * H3(i, 2, seed);

      pos.push([x, y, cols[i % cols.length], va]);
    }
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      const d = Math.hypot(pos[i][0] - pos[j][0], pos[i][1] - pos[j][1]);
      if (d < 56) g.line(pos[i][0], pos[i][1], pos[j][0], pos[j][1], { color: ENEMY, w: 1.6, alpha: 0.75 * (1 - d / 56) * pos[i][3] * pos[j][3] });
    }
    for (const [x, y, c, va] of pos) g.dot(x, y, 7, c, va, 2.4);
  });
}

function exploitPanel(g, t, S) {
  label(g, 'Exploitative · indirect', 140, 262);
  const lv = lerp(0.92, 0.2, S.io(1, 13, 3.4));
  const px = 312, py = 420, pw = 190, ph = 290, cx = px + pw / 2;

  const cl = [[196, 560, C1], [616, 560, C2]];
  cl.forEach(([qx, qy, col], side) => {
    for (let k = 0; k < 9; k++) {
      const u = frac(S.since(1) * 0.42 + k / 9 + side * 0.05);
      const sx = cx + (side ? 40 : -40), sy = top + 4; const mx = (sx + qx) / 2, my = Math.min(sy, qy) - 120;
      const x = (1 - u) * (1 - u) * sx + 2 * (1 - u) * u * mx + u * u * qx, y = (1 - u) * (1 - u) * sy + 2 * (1 - u) * u * my + u * u * qy;

  g.poly(wave, { color: RES, w: 2.5, alpha: 0.9 });
  g.rect(px, py, pw, ph, { r: 18, stroke: PAL.ink2, w: 2.5 });
  g.math('R', cx, py + ph + 48, { size: 42, color: RES, align: 'center' });
  g.text('shared resource', cx, py - 20, { size: 22, color: RES, align: 'center' });

    }

  });
  // the indirect pathway

  g.text('each lowers R for the other', 405, 826, { size: 22, color: PAL.ink, align: 'center', alpha: q });
  g.text('water · nitrogen · prey', 405, 862, { size: 21, color: PAL.ink3, align: 'center', alpha: S.p(1, 0.8, 6.6) });
}

function interferePanel(g, t, S) {
  const a = S.p(1, 0.8, 8.6); if (a <= 0) return;
  g.withAlpha(a, () => {
    label(g, 'Interference · direct', 780, 262);
    const cx = 1035, cy = 530, R = 165;
    g.circle(cx, cy, R, { fill: U.rgba(C1, 0.06), stroke: C1, w: 2, dash: [9, 8] });

    const T = 4.4, tt = S.since(1) - 9.1; const cyc = Math.floor(tt / T), u = frac(tt / T);
    const side = cyc % 2 === 0 ? 0 : Math.PI; const ang = side + (H3(cyc, 5) - 0.5) * 0.8;

/* Schoener's six mechanisms: vignettes drawn in a w×h box at (x,y). */
const VIG = {
  consume(g, x, y, w, h, t) {
    const cx = x + w / 2, cy = y + h / 2 + 6;
    for (let k = 0; k < 14; k++) { const a = k * 2.4, r = 6 + 26 * H3(k, 4); g.circle(cx + r * Math.cos(a), cy + r * Math.sin(a), 3.4, { fill: RES, alpha: 0.85 }); }

    ends.forEach(([ex, ey, col, nm], s) => {
      for (let k = 0; k < 6; k++) { const u = frac(t * 0.55 + k / 6 + s * 0.08); g.circle(lerp(cx + (s ? 22 : -22), ex, u), ey + 26 * Math.sin(Math.PI * u) * (k % 2 ? 1 : -1), 3.6, { fill: RES, alpha: Math.sin(Math.PI * u) }); }
      g.dot(ex, ey, 16, col, 1, 2.2);

  },
  preempt(g, x, y, w, h, t) {
    const gy = y + h - 30; g.rect(x, gy, w, 30, { fill: 'rgba(216,196,155,0.16)', r: 4 });
    for (let k = 0; k < 7; k++) g.icon('barnacle', x + 26 + k * (w - 52) / 6, gy - 14, 36, C1);
    const u = frac(t / 3.4); const lx = x + w * 0.56;
    const ly = u < 0.5 ? lerp(y + 6, gy - 52, ease.out(u / 0.5)) : gy - 52 - 70 * ease.inOut((u - 0.5) / 0.5);
    const dx = u < 0.5 ? 0 : 90 * ease.inOut((u - 0.5) / 0.5);
    g.dot(lx + dx, ly, 6, C2, u < 0.92 ? 1 : (1 - u) / 0.08, 2.4);
    g.text('×', lx, gy - 30, { size: 26, color: ENEMY, align: 'center', alpha: clamp((u - 0.45) / 0.05) * (1 - clamp((u - 0.7) / 0.1)) });
    g.text('settler: no space left', x + w, y + 14, { size: 20, color: C2, align: 'right', alpha: 0.9 });
  },
  overgrow(g, x, y, w, h, t, p) {
    const gy = y + h - 12; g.line(x, gy, x + w, gy, { color: PAL.sand, w: 2, alpha: 0.5 });

    // rays
    for (let k = 0; k < 9; k++) { const rx = x + 20 + k * (w - 40) / 8; const stop = rx > sx - 6 && rx < sx + plW ? py - 8 : gy - 52 * Math.sqrt(Math.max(0, 1 - ((rx - mx) / 74) ** 2)) - 4; g.line(rx, y, rx, Math.min(stop, gy), { color: PAL.sand, w: 1.6, dash: [6, 8], dashOffset: -t * 30, alpha: 0.5 }); }
    // shadow under plate
    g.poly([[sx, py + 8], [sx + plW, py + 8], [sx + plW, gy], [sx, gy]], { fill: 'rgba(0,0,0,0.3)', color: null, w: 0 });
    g.line(sx, gy, sx, py, { color: C2, w: 7 });

    for (let k = 0; k < 5; k++) { const px = x + 146 + k * 40; const near = px - tx < 175; g.icon('plant', px + (near ? 6 : 0), gy - 22 + (near ? 4 : 0), 46, near ? PAL.ink3 : C1, { rot: near ? 0.75 : 0 }); }
    g.text('juglone', x + w - 8, gy + 26, { size: 20, color: COL, align: 'right', alpha: S.p(2, 0.6, 14.9) });

    g.icon('bird', x + w - 96, y + 70 + 10 * Math.sin(t * 2.2), 74, PAL.ink2, { flap: 0.5 + 0.5 * Math.sin(t * 8) });
    sparks(g, cx + 20, gy - 74, 30, PAL.ochre, 0.6 + 0.4 * Math.sin(t * 11), t);
    g.text('wolf', x + 2, gy - 104, { size: 20, color: ENEMY });
    g.text('vulture', x + w - 96, y + 22, { size: 20, color: PAL.ink2, align: 'center' });

};

function schoenerPanel(g, t, S) {
  label(g, 'Schoener (1983) · six mechanisms', 140, 262);
  const tiles = [
    ['Consumptive', 'use of a shared resource', 3.4, 'consume'],
    ['Preemptive', 'occupying space first', 6.2, 'preempt'],
    ['Overgrowth', 'growing over and shading', 8.5, 'overgrow'],
    ['Chemical', 'allelopathy', 12.4, 'chem'],
    ['Territorial', 'defended space', 17.2, 'terr'],

    const col = k % 3, row = Math.floor(k / 3);

    const p = S.p(2, 0.7, t0); if (p <= 0) return;
    const next = k < 5 ? tiles[k + 1][2] : 99;

function scaled(S, ref) {

function rk4(f, y, dt) {
  const k1 = f(y[0], y[1]);

  const k4 = f(y[0] + dt * k3[0], y[1] + dt * k3[1]);

<script>/* chapters/ch5_islands.js */
/* Chapter V — Island biogeography. */
(function () {
const { PAL, U, Theater } = window; const { clamp, lerp, ease, rng, gauss } = U;
const COL = PAL.lagoon;

// Small shared helpers ---------------------------------------------------------
const TAU = Math.PI * 2;
const label = (g, s, x, y, a = 1, col = PAL.ink3) => g.text(s.toUpperCase(), x, y, { size: 17, weight: 600, color: col, ls: 2.6, alpha: a });
// visibility envelope: fade in at beat k0, fade out at beat k1 (optional)
const vis = (S, k0, k1, d = 0.8) => S.p(k0, d) * (k1 === undefined ? 1 : 1 - S.p(k1, 0.6));
const SEA_HI = '#0F3C44', SEA_LO = '#0A272D';
const LAND = '#2E5338', LAND_C = ['#3E6A45', '#4D7C4E', '#284A33', '#5A8A55'];

// Irregular island outline: polar radius r(a) from looped fBm noise, squashed in y for a map look.
function makeIsland(r, seed, o = {}) {
  const n = o.n || 120, rough = o.rough ?? 0.36, sq = o.squash ?? 0.86, el = o.elong ?? 0.1, phi = o.phi ?? seed * 1.7;
  const rad = new Float32Array(n), pts = [];
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const f = 1 + rough * U.fbm2(5 + 1.15 * ca, 5 + 1.15 * sa, seed, 5) + 0.07 * U.noise2(9 + 4 * ca, 9 + 4 * sa, seed + 3) + el * Math.cos(2 * (a - phi)) + 0.06 * Math.cos(3 * (a - phi * 1.3));
    rad[k] = r * Math.max(0.4, f); pts.push([ca * rad[k], sa * rad[k] * sq]);
  }
  const radAt = (a) => { const u = (((a / TAU) % 1) + 1) % 1 * n; const i = Math.floor(u), f = u - i; return lerp(rad[i % n], rad[(i + 1) % n], f); };
  const inside = (x, y, frac = 1) => { const yy = y / sq; return Math.hypot(x, yy) < radAt(Math.atan2(yy, x)) * frac; };
  return { r, n, pts, sq, radAt, inside };
}
const scaled = (pts, s, cx = 0, cy = 0) => pts.map(([x, y]) => [cx + x * s, cy + y * s]);
function pathOf(c, pts) { c.beginPath(); pts.forEach(([x, y], k) => (k ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); }
// Well-spaced points inside an island (best-candidate sampling).
function scatter(shape, n, seed, frac = 0.72) {
  const r = rng(seed), out = [];
  for (let k = 0; k < n; k++) {
    let best = null, bd = -1;
    for (let m = 0; m < 30; m++) {
      const x = (r() * 2 - 1) * shape.r * 1.4, y = (r() * 2 - 1) * shape.r * 1.4 * shape.sq;
      if (!shape.inside(x, y, frac)) continue;
      let d = 1e9; for (const p of out) d = Math.min(d, Math.hypot(p[0] - x, p[1] - y));
      if (d > bd) { bd = d; best = [x, y]; }
    }
    out.push(best || [0, 0]);
  }

}
// Paint one island (shallows, beach, vegetated interior, contours) onto a 2D context.
function paintIsland(c, cx, cy, sh, seed, o = {}) {
  const P = (s) => scaled(sh.pts, s, cx, cy);
  c.save();
  c.fillStyle = 'rgba(95,192,210,0.08)'; pathOf(c, P(1.3)); c.fill();
  c.fillStyle = 'rgba(95,192,210,0.13)'; pathOf(c, P(1.13)); c.fill();
  pathOf(c, P(1)); c.fillStyle = o.land || LAND; c.fill();
  if (sh.r > 34) { c.fillStyle = 'rgba(120,160,95,0.16)'; pathOf(c, P(0.64)); c.fill(); }
  if (sh.r > 60) { c.fillStyle = 'rgba(140,175,110,0.16)'; pathOf(c, P(0.38)); c.fill(); }
  c.save(); pathOf(c, P(1)); c.clip();
  const r = rng(seed * 31 + 7), N = Math.round(sh.r * sh.r * 0.11);
  for (let k = 0; k < N; k++) {
    const x = cx + (r() * 2 - 1) * sh.r * 1.4, y = cy + (r() * 2 - 1) * sh.r * 1.4 * sh.sq;
    c.globalAlpha = 0.3 + 0.35 * r(); c.fillStyle = LAND_C[k % 4]; c.beginPath(); c.arc(x, y, 1.4 + r() * 3.2, 0, TAU); c.fill();

// MacArthur–Wilson rates for a pool of P species (per second of scene time).

const POOL = 32;
const Irate = (S, I0) => { const s = S / POOL; return I0 * (1 - s) * (1 - 0.55 * s); };
const Erate = (S, E1) => { const s = S / POOL; return E1 * s * (0.35 + 0.65 * s); };

function islandSim(seed, I0, E1, S0, t0, t1) {

    const a = Irate(S, I0), b = Erate(S, E1); t += -Math.log(1 - r()) / (a + b); if (t > t1) break;

  }

}

<script>/* chapters/ch9_synthesis.js */
/* Chapter IX — Synthesis. */
(function () {
const { PAL, U, Theater } = window; const { clamp, lerp, ease, rng, gauss } = U;
const COL = PAL.ink;

// Shared helpers -------------------------------------------------------------
const label = (g, s, x, y, a = 1, col = PAL.ink3, align = 'left') => g.text(s.toUpperCase(), x, y, { size: 17, weight: 600, color: col, ls: 2.6, alpha: a, align });
const vis = (S, k0, k1, d = 0.8) => S.p(k0, d) * (k1 === undefined ? 1 : 1 - S.p(k1, 0.6));
// Time (scene-local s) at which `phrase` is spoken within beat k, interpolated by character position.
const CUES = new WeakMap();
function cue(S, k, phrase) {
  const sc = S.scene; let m = CUES.get(sc); if (!m) CUES.set(sc, (m = new Map()));
  const key = k + '|' + phrase; let v = m.get(key);
  if (v === undefined) {
    const B = sc.timing.beats[k]; v = B ? B.start : S.dur;
    if (B) for (const s of B.sents) { const i = s.cap.indexOf(phrase); if (i >= 0) { v = s.start + (s.end - s.start) * i / s.cap.length; break; } }
    m.set(key, v);
  }
  return v;
}
const chCol = (id) => { const c = Theater.chapters.find((x) => x.id === id); return (c && c.color) || PAL.ink2; };
// Process colours used throughout the chapter.
const PROC = [
  { nm: 'Selection', gen: 'natural selection', col: PAL.coral },
  { nm: 'Drift', gen: 'genetic drift', col: PAL.heather },
  { nm: 'Dispersal', gen: 'gene flow', col: PAL.lagoon },
  { nm: 'Speciation', gen: 'mutation', col: PAL.moss },
];

// Small animated emblems for each process, centred on (x, y), ~200 × 90 px.
function emblem(g, k, x, y, t, a, D) {
  if (a <= 0) return;
  const col = PROC[k].col;
  g.withAlpha(a, () => {
    if (k === 0) { // selection: deterministic replacement of the less fit species
      const ph = (t * 0.22) % 1, n = 40; const up = [], dn = [];
      for (let i = 0; i <= n; i++) { const u = i / n; const f = 1 / (1 + Math.exp(-(u - 0.45) * 9)); up.push([x - 95 + 190 * u, y + 36 - 72 * f]); dn.push([x - 95 + 190 * u, y - 36 + 72 * f]); }
      g.poly(up, { color: col, w: 3, progress: clamp(ph * 1.4) }); g.poly(dn, { color: PAL.ink3, w: 2.5, progress: clamp(ph * 1.4), dash: [5, 5] });
    } else if (k === 1) { // drift: random walks of relative abundance
      const ph = (t * 0.2) % 1;
      D.walks.forEach((w, i) => g.poly(w.map(([u, v]) => [x - 95 + 190 * u, y + 40 - 80 * v]), { color: i === 0 ? col : U.rgba(col, 0.55), w: i === 0 ? 2.6 : 1.6, progress: clamp(ph * 1.3) }));
    } else if (k === 2) { // dispersal: hops between two patches
      g.circle(x - 70, y + 10, 26, { stroke: PAL.ink3, w: 1.6 }); g.circle(x + 70, y + 10, 26, { stroke: PAL.ink3, w: 1.6 });
      g.poly(Array.from({ length: 21 }, (_, i) => { const u = i / 20; return [lerp(x - 44, x + 44, u), y + 4 - Math.sin(Math.PI * u) * 46]; }), { color: col, w: 1.6, dash: [3, 5], alpha: 0.7 });
      for (let q = 0; q < 3; q++) { const u = (t * 0.45 + q / 3) % 1; g.dot(lerp(x - 44, x + 44, u), y + 4 - Math.sin(Math.PI * u) * 46, 4.5, col, 1, 2.4); }
      for (let q = 0; q < 3; q++) { g.circle(x - 70 + Math.cos(q * 2.1 + t) * 11, y + 10 + Math.sin(q * 2.1 + t) * 11, 4, { fill: col, alpha: 0.85 }); g.circle(x + 70 + Math.cos(q * 2.1 - t) * 11, y + 10 + Math.sin(q * 2.1 - t) * 11, 4, { fill: col, alpha: 0.85 }); }
    } else { // speciation: a growing phylogeny
      const ph = (t * 0.2) % 1;
      const br = (x0, y0, len, ang, d, p0) => {
        const p = clamp((ph * 1.3 - p0) / 0.28); if (p <= 0) return;
        const x1 = x0 + Math.cos(ang) * len * p, y1 = y0 + Math.sin(ang) * len * p;
        g.line(x0, y0, x1, y1, { color: col, w: 3 - d * 0.6 });
        if (p >= 1 && d < 3) { br(x1, y1, len * 0.72, ang - 0.42, d + 1, p0 + 0.26); br(x1, y1, len * 0.72, ang + 0.42, d + 1, p0 + 0.26); }
        else if (p >= 1) g.dot(x1, y1, 3.5, col, 1, 2.2);
      };
      br(x - 92, y, 52, 0, 0, 0);
    }
  });
}

// Tiny answer sketches for the rehearsal cards, drawn in card-local coordinates
// inside the box (X0, Y0)–(X0 + 488, Y0 + 116); p = drawing progress.
function sketch(g, i, p, X0, Y0, t) {
  if (p <= 0) return;
  const ax = (x, y, w, h) => { g.line(x, y + h, x + w, y + h, { color: PAL.ink3, w: 2 }); g.line(x, y + h, x, y, { color: PAL.ink3, w: 2 }); };
  const fpts = (x, y, w, h, f, n = 40) => Array.from({ length: n + 1 }, (_, k) => { const u = k / n; return [x + u * w, y + h - f(u) * h]; });
  const y0 = Y0 + 6, H = 100;
  if (i === 0) { // Type II intake saturates; per-capita risk falls with prey density
    ax(X0 + 20, y0, 190, H); ax(X0 + 280, y0, 190, H);
    g.poly(fpts(X0 + 20, y0, 190, H, (u) => 0.95 * (6 * u) / (1 + 6 * u)), { color: PAL.coral, w: 3, progress: p });
    g.poly(fpts(X0 + 280, y0, 190, H, (u) => 0.95 / (1 + 6 * u)), { color: PAL.coral, w: 3, progress: clamp(p * 1.5 - 0.5) });

    g.math('f(N)/N', X0 + 330, y0 + 18, { size: 22, color: PAL.ink2, alpha: clamp(p * 1.5 - 0.5) });
    g.math('N', X0 + 218, y0 + H + 6, { size: 20, color: PAL.ink3 }); g.math('N', X0 + 478, y0 + H + 6, { size: 20, color: PAL.ink3 });
  } else if (i === 1) { // R* drawdown
    ax(X0 + 20, y0, 450, H);
    g.line(X0 + 20, y0 + 40, X0 + 420, y0 + 40, { color: PAL.lagoon, w: 2, dash: [6, 6], alpha: p });
    g.line(X0 + 20, y0 + 78, X0 + 420, y0 + 78, { color: PAL.ochre, w: 2, dash: [6, 6], alpha: p });
    g.poly(fpts(X0 + 20, y0 + 12, 400, H - 12, (u) => 0.25 + 0.75 * Math.exp(-5 * u)), { color: PAL.ink, w: 3, progress: p });
    g.math('R^*_B', X0 + 432, y0 + 47, { size: 22, color: PAL.lagoon, alpha: p }); g.math('R^*_A', X0 + 432, y0 + 85, { size: 22, color: PAL.ochre, alpha: p });
    g.math('R', X0 + 8, y0 + 16, { size: 22, color: PAL.ink2, align: 'right', alpha: p }); g.text('A draws R below B’s needs', X0 + 150, y0 + 30, { size: 20, color: PAL.ochre, alpha: clamp(p * 2 - 1) });
  } else if (i === 2) { // extinction threshold while habitat remains
    ax(X0 + 20, y0, 230, H);
    const th = 0.7;
    g.rect(X0 + 20 + th * 230, y0, 230 * (1 - th), H, { fill: U.rgba(PAL.moss, 0.12), stroke: U.rgba(PAL.moss, 0.5), w: 1.2, dash: [4, 4], alpha: p });
    g.poly([[X0 + 20, y0 + H - th * H], [X0 + 20 + th * 230, y0 + H], [X0 + 250, y0 + H]], { color: PAL.ochre, w: 3, progress: p });
    g.math('p^*', X0 + 30, y0 + 14, { size: 22, color: PAL.ink2, alpha: p }); g.math('D', X0 + 258, y0 + H + 6, { size: 20, color: PAL.ink3 });
    g.math('p^* = 1 − D − e/c', X0 + 280, y0 + 42, { size: 26, color: PAL.ink, alpha: clamp(p * 2 - 0.6) });
    g.text('extinct with patches left', X0 + 280, y0 + 84, { size: 20, color: PAL.ochre, alpha: clamp(p * 2 - 1) });
  } else if (i === 3) { // Chesson's coexistence wedge
    ax(X0 + 20, y0, 230, H);
    const up = [], dn = []; for (let k = 0; k <= 30; k++) { const u = k / 30 * 0.92; const d = Math.log(1 / (1 - u)) * 20; up.push([X0 + 20 + u * 230 / 0.92, y0 + H / 2 - d]); dn.push([X0 + 20 + u * 230 / 0.92, y0 + H / 2 + d]); }
    const cl = (q) => q.map(([x, y]) => [x, clamp(y, y0, y0 + H)]);
    g.poly([...cl(up), ...cl(dn).reverse()], { fill: U.rgba(PAL.moss, 0.22), color: null, w: 0, alpha: p });
    g.poly(cl(up), { color: PAL.moss, w: 2.5, progress: p }); g.poly(cl(dn), { color: PAL.moss, w: 2.5, progress: p });
    g.text('coexistence', X0 + 200, y0 + H / 2 + 7, { size: 19, color: PAL.moss, align: 'center', alpha: clamp(p * 2 - 1) });
    g.math('1 − ρ', X0 + 250, y0 + H + 22, { size: 18, color: PAL.ink3, align: 'right' }); g.math('κ_1/κ_2', X0 + 28, y0 + 10, { size: 18, color: PAL.ink3 });

    g.text('equalizing: ratio → 1', X0 + 272, y0 + 72, { size: 20, color: PAL.ink2, alpha: clamp(p * 2 - 1) });
  } else if (i === 4) { // four paradigm icons

    for (let k = 0; k < 4; k++) {
      const a = clamp(p * 4 - k), cx = X0 + 60 + k * 122, cy = y0 + 40;

          const dots = k === 0 ? [j === 2 ? PAL.coral : PAL.ochre] : k === 1 ? [env[j], env[j]] : k === 2 ? [env[j], env[(j + 1) % 3]] : [env[(j + Math.floor(t * 0.7)) % 3], PAL.heather];
          dots.forEach((cc, q) => g.circle(x + (q - (dots.length - 1) / 2) * 8, y, 3.6, { fill: cc }));

    g.math('J_M', X0 + 262, y0 + 38, { size: 22, color: PAL.ink2, alpha: clamp(p * 2 - 0.6) }); g.text('metacommunity size', X0 + 306, y0 + 38, { size: 20, color: PAL.ink2, alpha: clamp(p * 2 - 0.6) });
